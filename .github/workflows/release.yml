name: Release

# Two ways in:
#   1. push to main  → release-please maintains a running "release PR" that
#      accumulates Conventional Commits. Merging that PR bumps the version,
#      updates CHANGELOG.md, tags vX.Y.Z, and creates the GitHub Release
#      with generated notes — then the publish job below attaches the
#      built sdist + wheel to it.
#   2. manual dispatch, from main only → publishes the version currently
#      in pipeview/__init__.py (creates the tag + release if they don't
#      exist). Used once to bootstrap v0.2.0, and as an escape hatch.
#      From any other branch it deliberately does nothing: the tag it
#      would target already exists, so it would overwrite a real
#      release's assets with a branch build. To try a branch's build,
#      use the Preview release workflow (preview.yml) instead.
#
# Requires (repo Settings → Actions → General → Workflow permissions):
#   - "Read and write permissions"
#   - "Allow GitHub Actions to create and approve pull requests"

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created || steps.rp.outputs['.--release_created'] }}
      tag_name: ${{ steps.rp.outputs.tag_name || steps.rp.outputs['.--tag_name'] }}
      vscode_release_created: ${{ steps.rp.outputs['editors/vscode--release_created'] }}
      vscode_tag_name: ${{ steps.rp.outputs['editors/vscode--tag_name'] }}
      zed_release_created: ${{ steps.rp.outputs['editors/zed--release_created'] }}
      zed_tag_name: ${{ steps.rp.outputs['editors/zed--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Build sdist + wheel and attach them to the GitHub Release. Runs when
  # release-please just cut a release, or on manual dispatch (bootstrap).
  publish:
    needs: release-please
    if: >-
      always() &&
      (needs.release-please.outputs.release_created == 'true' ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Attach packages to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag='${{ needs.release-please.outputs.tag_name }}'
          if [ -z "$tag" ]; then
            tag="v$(python -c 'import pipeview; print(pipeview.__version__)')"
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            # Bootstrap path: create the tag + release with generated notes.
            gh release create "$tag" dist/* --repo "$GITHUB_REPOSITORY" \
              --title "$tag" --generate-notes
          fi

  # Package the VS Code extension and attach the .vsix to its release
  # (tags vscode-vX.Y.Z; versions come from release-please, never by hand).
  publish-vscode:
    needs: release-please
    if: needs.release-please.outputs.vscode_release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.vscode_tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx --yes @vscode/vsce package
      - name: Attach the .vsix to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload '${{ needs.release-please.outputs.vscode_tag_name }}' \
            *.vsix --repo "$GITHUB_REPOSITORY" --clobber

  # Package the Zed extension as Zed installs it — a directory with
  # extension.toml beside the compiled extension.wasm, archived as .zip
  # and .tar.gz — and attach both to its release (tags zed-vX.Y.Z). A bare
  # .wasm is not installable; the archive is: zed: extensions → Install
  # Dev Extension on the extracted folder, no Rust toolchain needed on
  # any platform (editors/zed/README.md).
  publish-zed:
    needs: release-please
    if: needs.release-please.outputs.zed_release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: editors/zed
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.zed_tag_name }}
      - run: rustup target add wasm32-wasip2
      - name: Build and package the installable extension directory
        env:
          TAG: ${{ needs.release-please.outputs.zed_tag_name }}
        # --expect-version: the manifest must agree with the tag being
        # published (release-please bumps extension.toml via its
        # x-release-please-version annotation; this catches a hand edit).
        run: scripts/package.sh --expect-version "${TAG#zed-v}"
      - name: Attach the archives to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload '${{ needs.release-please.outputs.zed_tag_name }}' \
            dist/*.zip dist/*.tar.gz --repo "$GITHUB_REPOSITORY" --clobber
