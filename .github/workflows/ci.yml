name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch/PR to save runner minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - run: ruff check .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # Ubuntu runners ship make and node, which the enrichment and
      # What-If parity tests need (they self-skip when missing — fail
      # loudly here instead so CI never silently loses coverage).
      - name: Check test prerequisites
        run: |
          make --version | head -1
          node --version
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest tests/

  build:
    name: Package build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  vscode:
    name: VS Code extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci
      # tsc build + node --test unit tests over the pure helpers
      - run: npm test
      # The same packaging step the release job runs — fail here, not there.
      - run: npx --yes @vscode/vsce package
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: editors/vscode/*.vsix
          retention-days: 7

  zed:
    name: Zed extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/zed
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add wasm32-wasip2
      - run: cargo build --release --target wasm32-wasip2
