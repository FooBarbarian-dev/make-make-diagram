[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pipeview"
# Managed by release-please — must match pipeview/__init__.py __version__
# (a test enforces this). Do not bump by hand.
version = "0.2.1"
description = "Offline interactive HTML reports for GNU Make, GitLab CI, and GitHub Actions pipelines"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["make", "makefile", "gitlab", "github", "actions", "ci", "pipeline", "visualization", "offline"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Documentation",
]
dependencies = ["PyYAML>=6"]

[project.scripts]
pipeview = "pipeview.cli:main"

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
