[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "pipeview"
version = "0.1.0"
description = "Offline interactive HTML reports for GNU Make and GitLab CI pipelines"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
pipeview = "pipeview.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
