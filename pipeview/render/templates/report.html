<html lang="en">
<head>

<style>
/* ============================================================
   Design tokens. Every color, size, and space in this file
   derives from these. Light is the base; dark overrides the
   same names via data-theme or prefers-color-scheme.
   ============================================================ */
:root {
  /* type */
  --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
  --fs-0: 11px;  /* chips, overlines, fine print */
  --fs-1: 12px;  /* dense data, meta, code */
  --fs-2: 13px;  /* body */
  --fs-3: 15px;  /* section headings */
  --fs-4: 18px;  /* view titles */
  /* space (4px base) */
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 24px; --sp-6: 32px;
  /* detail */
  --radius: 6px;
  --radius-sm: calc(var(--radius) - 2px);
  --shadow: 0 2px 10px rgba(15, 20, 30, 0.14);
  --hit: 32px; /* minimum control hit target */

  /* color — light */
  --surface: #f4f5f7;
  --surface-raised: #ffffff;
  --surface-sunken: #eceef2;
  --border: #d8dce3;
  --border-strong: #aeb6c2;
  --text: #1a2029;
  --text-muted: #5a6371;
  --accent: #3b5bdb;
  --accent-strong: #2f4bc0;
  --accent-tint: #e9eefc;
  --accent-contrast: #ffffff;
  --ok: #26703a;      --ok-bg: #e2f2e7;
  --info: #1868b3;    --info-bg: #e3effa;
  --warn: #8a5300;    --warn-bg: #faf0da;
  --error: #b32626;   --error-bg: #fbe7e7;
  --scrim: rgba(20, 24, 32, 0.35);
  /* edge kinds (second channel is always the dash pattern) */
  --edge-prerequisite: #5a6371;
  --edge-order-only: #a05a00;
  --edge-needs: #3b5bdb;
  --edge-stage-order: #8f3fa8;
  --edge-includes: #0f7b6c;
  --edge-invokes: #bb2f63;
  --edge-extends: #6741d9;
}
[data-theme="dark"] { color-scheme: dark; }
:root[data-theme="dark"] {
  --surface: #15181d;
  --surface-raised: #1d2127;
  --surface-sunken: #101317;
  --border: #2e343d;
  --border-strong: #4c5563;
  --text: #e5e9ef;
  --text-muted: #9aa4b1;
  --accent: #8da2f2;
  --accent-strong: #a9b8f5;
  --accent-tint: #262e45;
  --accent-contrast: #10131f;
  --ok: #85d197;      --ok-bg: #1a2b1f;
  --info: #82bdf2;    --info-bg: #1a2733;
  --warn: #e3b566;    --warn-bg: #2e2617;
  --error: #f09090;   --error-bg: #331c1c;
  --scrim: rgba(0, 0, 0, 0.5);
  --shadow: 0 2px 12px rgba(0, 0, 0, 0.45);
  --edge-prerequisite: #98a2b0;
  --edge-order-only: #d99a4e;
  --edge-needs: #8da2f2;
  --edge-stage-order: #d08fe0;
  --edge-includes: #55c0ae;
  --edge-invokes: #ef82a9;
  --edge-extends: #ab97ec;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --surface: #15181d;
    --surface-raised: #1d2127;
    --surface-sunken: #101317;
    --border: #2e343d;
    --border-strong: #4c5563;
    --text: #e5e9ef;
    --text-muted: #9aa4b1;
    --accent: #8da2f2;
    --accent-strong: #a9b8f5;
    --accent-tint: #262e45;
    --accent-contrast: #10131f;
    --ok: #85d197;      --ok-bg: #1a2b1f;
    --info: #82bdf2;    --info-bg: #1a2733;
    --warn: #e3b566;    --warn-bg: #2e2617;
    --error: #f09090;   --error-bg: #331c1c;
    --scrim: rgba(0, 0, 0, 0.5);
    --shadow: 0 2px 12px rgba(0, 0, 0, 0.45);
    --edge-prerequisite: #98a2b0;
    --edge-order-only: #d99a4e;
    --edge-needs: #8da2f2;
    --edge-stage-order: #d08fe0;
    --edge-includes: #55c0ae;
    --edge-invokes: #ef82a9;
    --edge-extends: #ab97ec;
  }
}

/* ============================================================
   Base
   ============================================================ */
* { margin: 0; padding: 0; box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  font-family: var(--font-ui);
  font-size: var(--fs-2);
  line-height: 1.45;
  background: var(--surface);
  color: var(--text);
  display: flex;
  flex-direction: column;
  /* Desktop tool: below this, horizontal page scroll is intended. */
  min-width: 960px;
  overflow: auto;
}
a { color: var(--accent); text-decoration: none; cursor: pointer; }
a:hover { text-decoration: underline; }
code { font-family: var(--font-mono); font-size: var(--fs-1); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-radius: 2px; }
::selection { background: var(--accent-tint); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    transition: none !important;
    animation: none !important;
    scroll-behavior: auto !important;
  }
}

/* ============================================================
   Overflow policy (applies everywhere):
   - .clip      single-line contexts: ellipsis + full value in title/panel
   - .wrap-any  prose that may contain long tokens: break anywhere
   - pre/.codeblock  code: preserved whitespace, horizontal scroll
                     inside the block, optional soft-wrap toggle
   - paths are middle-truncated in JS (tail preserved)
   ============================================================ */
.clip { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.wrap-any { overflow-wrap: anywhere; }
.codeblock {
  background: var(--surface-sunken);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: var(--sp-2) var(--sp-3);
  font-family: var(--font-mono);
  font-size: var(--fs-1);
  line-height: 1.6;
  white-space: pre;
  overflow-x: auto;
  max-width: 100%;
}
.codeblock.soft-wrap { white-space: pre-wrap; overflow-wrap: anywhere; }
.codeblock .var-ref { color: var(--accent); cursor: pointer; }
.codeblock .var-ref:hover { text-decoration: underline; }
/* hover-explained code glyphs: dotted underline signals "there's a meaning here" */
.codeblock .auto-var,
.codeblock .recipe-prefix {
  text-decoration: underline dotted var(--text-muted);
  text-underline-offset: 2px;
  cursor: help;
}

/* ============================================================
   Shared components
   ============================================================ */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: var(--hit); min-width: var(--hit);
  padding: 0 var(--sp-3);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface-raised);
  color: var(--text);
  font: 500 var(--fs-1) var(--font-ui);
  cursor: pointer;
  white-space: nowrap;
}
.btn:hover { border-color: var(--border-strong); background: var(--surface-sunken); }
.btn:active { background: var(--surface-sunken); }
.btn.copied { color: var(--ok); border-color: var(--ok); }
.btn-quiet { border-color: transparent; background: transparent; color: var(--text-muted); }
.btn-quiet:hover { background: var(--surface-sunken); color: var(--text); border-color: transparent; }

.chip {
  display: inline-block;
  padding: 1px 7px;
  border-radius: var(--radius-sm);
  font-size: var(--fs-0);
  font-weight: 500;
  line-height: 1.5;
  background: var(--surface-sunken);
  border: 1px solid var(--border);
  color: var(--text-muted);
  white-space: nowrap;
  vertical-align: middle;
}
.chip-accent { background: var(--accent-tint); border-color: transparent; color: var(--accent); }
.chip-ok     { background: var(--ok-bg);     border-color: transparent; color: var(--ok); }
.chip-info   { background: var(--info-bg);   border-color: transparent; color: var(--info); }
.chip-warn   { background: var(--warn-bg);   border-color: transparent; color: var(--warn); }
.chip-error  { background: var(--error-bg);  border-color: transparent; color: var(--error); }
.chip-ghost  { border-style: dashed; }

.input {
  min-height: var(--hit);
  padding: 0 var(--sp-3);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface-raised);
  color: var(--text);
  font: 400 var(--fs-2) var(--font-ui);
}
.input::placeholder { color: var(--text-muted); }
.input:focus { border-color: var(--accent); outline: none; }

/* file:line locations — one component everywhere */
.loc {
  font-family: var(--font-mono);
  font-size: var(--fs-0);
  color: var(--text-muted);
  white-space: nowrap;
}
a.loc:hover, .loc.loc-link:hover { color: var(--accent); text-decoration: underline; cursor: pointer; }

/* tooltips: shown on hover AND focus */
[data-tip] { position: relative; }
[data-tip]:hover::after, [data-tip]:focus-visible::after {
  content: attr(data-tip);
  position: absolute;
  top: calc(100% + 6px);
  left: 50%;
  transform: translateX(-50%);
  background: var(--text);
  color: var(--surface);
  font: 400 var(--fs-0) var(--font-ui);
  padding: 3px 8px;
  border-radius: var(--radius-sm);
  /* short tips stay one line; sentence-length tips wrap instead of
     escaping the viewport (overflow policy) */
  white-space: normal;
  width: max-content;
  max-width: 280px;
  z-index: 200;
  pointer-events: none;
}

/* designed empty states */
.empty {
  margin: var(--sp-6) auto;
  max-width: 420px;
  text-align: center;
  color: var(--text-muted);
}
.empty .empty-title { font-size: var(--fs-3); font-weight: 600; color: var(--text); margin-bottom: var(--sp-2); }
.empty.empty-good .empty-title { color: var(--ok); }
.empty p { font-size: var(--fs-2); }

mark {
  background: var(--accent-tint);
  color: var(--accent-strong);
  font-weight: 600;
  border-radius: 2px;
  padding: 0 1px;
}

@keyframes flash-row { 0% { background: var(--accent-tint); } 100% { background: transparent; } }
.flash { animation: flash-row 1.6s ease-out 1; }

/* ============================================================
   App chrome: header, tabs
   ============================================================ */
.app-header {
  display: flex; align-items: center; gap: var(--sp-3);
  padding: var(--sp-2) var(--sp-4);
  background: var(--surface-raised);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  min-height: 48px;
}
.brand { font-size: var(--fs-3); font-weight: 650; letter-spacing: -0.01em; white-space: nowrap; }
.brand .brand-pipe { color: var(--accent); }
.header-meta {
  display: flex; align-items: center; gap: var(--sp-2);
  min-width: 0; color: var(--text-muted); font-size: var(--fs-1);
}
.header-meta .root-path { font-family: var(--font-mono); color: var(--text); }
.header-actions { margin-left: auto; display: flex; align-items: center; gap: var(--sp-2); flex-shrink: 0; }
.diag-badge { border: none; }
.diag-badge:hover { filter: brightness(0.96); }

.tabs {
  display: flex; gap: var(--sp-1);
  padding: 0 var(--sp-3);
  background: var(--surface-raised);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.tab {
  appearance: none; border: none; background: none;
  padding: var(--sp-2) var(--sp-4);
  min-height: 40px;
  font: 500 var(--fs-2) var(--font-ui);
  color: var(--text-muted);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  transition: color 0.12s;
}
.tab:hover { color: var(--text); }
.tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
.tab .tab-count { color: var(--text-muted); font-weight: 400; font-size: var(--fs-0); margin-left: 4px; }

/* ============================================================
   Main layout: content | splitter | detail panel
   ============================================================ */
.main { display: flex; flex: 1; min-height: 0; }
.content { flex: 1; min-width: 320px; display: flex; flex-direction: column; position: relative; }

.view { display: none; flex: 1; min-height: 0; flex-direction: column; }
.view.active { display: flex; }
.view-toolbar {
  display: flex; align-items: center; gap: var(--sp-3);
  padding: var(--sp-2) var(--sp-4);
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  flex-shrink: 0;
  min-height: 48px;
}
.view-toolbar .toolbar-title { font-size: var(--fs-2); font-weight: 600; }
.view-toolbar .toolbar-note { color: var(--text-muted); font-size: var(--fs-1); }
.view-toolbar .toolbar-spacer { margin-left: auto; }
.view-body {
  flex: 1; min-height: 0;
  overflow: auto;
  scrollbar-gutter: stable;
  padding: var(--sp-4);
}
.view-body.no-pad { padding: 0; overflow: hidden; }

/* splitter */
.splitter {
  width: 6px; flex-shrink: 0;
  cursor: col-resize;
  background: var(--surface);
  border-left: 1px solid var(--border);
  position: relative;
}
.splitter::after {
  content: '';
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 2px; height: 40px;
  border-radius: 2px;
  background: var(--border-strong);
}
.splitter:hover, .splitter.dragging, .splitter:focus-visible { background: var(--accent-tint); }
.splitter:hover::after, .splitter.dragging::after { background: var(--accent); }

/* detail panel */
.panel {
  width: 400px;
  min-width: 300px;
  background: var(--surface-raised);
  display: flex; flex-direction: column;
  flex-shrink: 0;
  min-height: 0;
}
.main.panel-closed .panel, .main.panel-closed .splitter { display: none; }
.panel-header {
  display: flex; align-items: flex-start; gap: var(--sp-2);
  padding: var(--sp-3) var(--sp-4);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.panel-header .panel-name {
  font: 600 var(--fs-3) var(--font-mono);
  overflow-wrap: anywhere;
  min-width: 0; flex: 1;
}
.panel-body { flex: 1; overflow-y: auto; padding: var(--sp-3) var(--sp-4) var(--sp-5); min-height: 0; }
.panel-section { margin-bottom: var(--sp-4); }
.panel-section > h3 {
  font-size: var(--fs-0);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-muted);
  margin-bottom: var(--sp-2);
  display: flex; align-items: center; gap: var(--sp-2);
}
.panel-section > h3 .section-action { margin-left: auto; text-transform: none; letter-spacing: 0; }
.panel-section .value { font-size: var(--fs-2); }
.panel-idrow { display: flex; flex-wrap: wrap; gap: var(--sp-1); align-items: center; margin-bottom: var(--sp-1); }
.edge-list { list-style: none; }
.edge-list li {
  display: flex; align-items: center; gap: var(--sp-2);
  padding: 3px 0;
  min-width: 0;
}
.edge-list .edge-target { font-family: var(--font-mono); font-size: var(--fs-1); flex-shrink: 1; }
.kv-list { display: grid; grid-template-columns: auto 1fr; gap: var(--sp-1) var(--sp-3); font-size: var(--fs-1); }
.kv-list dt { color: var(--text-muted); white-space: nowrap; }
.kv-list dd { overflow-wrap: anywhere; font-family: var(--font-mono); }

/* ============================================================
   Graph view
   ============================================================ */
.graph-container { width: 100%; height: 100%; position: relative; overflow: hidden; background: var(--surface); }
.graph-container:active { cursor: grabbing; }
.graph-svg { width: 100%; height: 100%; display: block; }
.graph-node { cursor: pointer; }
.graph-node rect {
  fill: var(--surface-raised);
  stroke: var(--border-strong);
  stroke-width: 1.25;
  transition: stroke 0.1s;
}
.graph-node text {
  fill: var(--text);
  font-family: var(--font-mono);
  font-size: 11.5px;
  pointer-events: none;
}
.graph-node.is-task text { font-weight: 600; }
.graph-node.kind-stage rect { fill: var(--accent-tint); stroke: var(--accent); }
.graph-node.kind-ghost rect { fill: var(--surface-sunken); stroke: var(--text-muted); stroke-dasharray: 5 3; }
.graph-node.kind-ghost text { fill: var(--text-muted); }
.graph-node.kind-pattern_rule rect { stroke-dasharray: 1.5 2.5; }
.graph-node:hover rect { stroke: var(--accent); }
.graph-node.selected rect { stroke: var(--accent); stroke-width: 2.5; }
.graph-node.dimmed, .graph-edge.dimmed { opacity: 0.18; }
.graph-edge { fill: none; stroke-width: 1.5; }

.graph-controls {
  position: absolute; top: var(--sp-3); right: var(--sp-3);
  display: flex; flex-direction: column; gap: var(--sp-1);
  z-index: 10;
}
.graph-controls .btn { box-shadow: var(--shadow); font-size: var(--fs-3); padding: 0; }
.zoom-level {
  text-align: center;
  font: 500 var(--fs-0) var(--font-mono);
  color: var(--text-muted);
  background: var(--surface-raised);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 3px 0;
  box-shadow: var(--shadow);
}

.graph-legend {
  position: absolute; bottom: var(--sp-3); left: var(--sp-3);
  z-index: 10;
  background: var(--surface-raised);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  font-size: var(--fs-1);
  max-width: 260px;
}
.graph-legend summary {
  cursor: pointer;
  padding: var(--sp-2) var(--sp-3);
  font-weight: 600;
  min-height: var(--hit);
  display: flex; align-items: center;
  user-select: none;
  list-style-position: inside;
}
.graph-legend .legend-body { padding: 0 var(--sp-3) var(--sp-3); }
.legend-item { display: flex; align-items: center; gap: var(--sp-2); min-height: 28px; cursor: pointer; }
.legend-item input { accent-color: var(--accent); width: 14px; height: 14px; flex-shrink: 0; }
.legend-item svg { flex-shrink: 0; }
.legend-note { color: var(--text-muted); margin-top: var(--sp-2); font-size: var(--fs-0); }
.legend-note .sample-ghost {
  display: inline-block; width: 20px; height: 10px;
  border: 1.5px dashed var(--text-muted); border-radius: 3px;
  vertical-align: -1px; margin-right: 4px;
}

/* ============================================================
   Data tables (tasks, variables)
   ============================================================ */
.data-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
.data-table th {
  position: sticky; top: calc(-1 * var(--sp-4));
  background: var(--surface);
  text-align: left;
  font-size: var(--fs-0);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-muted);
  border-bottom: 2px solid var(--border);
  padding: var(--sp-2);
  z-index: 5;
  white-space: nowrap;
}
.data-table th.num, .data-table td.num { text-align: right; font-variant-numeric: tabular-nums; }
.data-table th button.sort-btn {
  appearance: none; background: none; border: none;
  font: inherit; color: inherit; letter-spacing: inherit; text-transform: inherit;
  cursor: pointer; padding: var(--sp-2); margin: calc(-1 * var(--sp-2));
  min-height: var(--hit);
}
.data-table th button.sort-btn:hover { color: var(--text); }
.data-table th .sort-arrow { font-size: 9px; margin-left: 3px; }
.data-table td {
  padding: var(--sp-2);
  border-bottom: 1px solid var(--border);
  font-size: var(--fs-2);
  vertical-align: middle;
}
.data-table tbody tr[tabindex] { cursor: pointer; }
.data-table tbody tr:hover td, .data-table tbody tr.row-selected td { background: var(--accent-tint); }
.data-table .cell-name { font-family: var(--font-mono); font-weight: 600; }
.data-table .cell-doc { color: var(--text); }
.data-table .cell-doc.no-doc { color: var(--text-muted); font-style: italic; }
.data-table .cell-value { font-family: var(--font-mono); font-size: var(--fs-1); }
.invocation {
  font-family: var(--font-mono); font-size: var(--fs-1);
  background: var(--surface-sunken);
  border: 1px solid var(--border);
  padding: 2px 8px; border-radius: var(--radius-sm);
}
td .btn.copy-btn { min-height: var(--hit); }

/* ============================================================
   Variable event timeline — the report's signature element.
   A vertical rail; each assignment event is a station with an
   operator badge, scope, location, and override diffs in place.
   ============================================================ */
.timeline { list-style: none; position: relative; padding-left: var(--sp-4); }
.timeline::before {
  content: '';
  position: absolute; left: 5px; top: 8px; bottom: 8px;
  width: 2px; border-radius: 1px;
  background: var(--border);
}
.tl-event { position: relative; padding: var(--sp-2) 0 var(--sp-2) var(--sp-1); }
.tl-event::before {
  content: '';
  position: absolute; left: calc(-1 * var(--sp-4) + 1px); top: 15px;
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--surface-raised);
  border: 2px solid var(--accent);
}
.tl-event.tl-final::before { background: var(--accent); }

<script>
const REPORT = /*MODEL_JSON_PLACEHOLDER*/{};

(function () {
  'use strict';

  /* ==========================================================
     Data indexes
     ========================================================== */
  const nodeMap = {};
  REPORT.nodes.forEach(n => { nodeMap[n.id] = n; });
  const varMap = {};
  REPORT.variables.forEach(v => { varMap[v.name] = v; });
  const filePaths = new Set(REPORT.files.map(f => f.path));

  // Edges drawable on the canvas (both endpoints are nodes);
  // includes/invokes edges reference file paths and live in the Files view.
  const graphEdges = REPORT.edges.filter(e => nodeMap[e.src] && nodeMap[e.dst]);
  const fileEdges = REPORT.edges.filter(e => !(nodeMap[e.src] && nodeMap[e.dst]));

  const isTask = n =>
    (n.kind === 'target' && n.flags && n.flags.indexOf('phony') >= 0) ||
    (n.kind === 'job' && (!n.flags || n.flags.indexOf('template') < 0));
  const tasks = REPORT.nodes.filter(isTask);

  const FLAG_LABELS = {
    default_goal: 'default goal', allow_failure: 'allow failure',
    starts_immediately: 'starts immediately', parallel: 'parallel'
  };
  const FLAG_TIPS = {
    starts_immediately: 'needs: [] — runs as soon as the pipeline starts, ignoring stage order',
    parallel: 'one definition expands to several jobs',
    delayed: 'starts after a configured delay',
    manual: 'runs only when a person triggers it',
    allow_failure: 'a failure does not fail the pipeline'
  };
  const flagLabel = f => FLAG_LABELS[f] || f.replace(/_/g, ' ');
  const flagChip = f => '<span class="chip"'
    + (FLAG_TIPS[f] ? ' data-tip="' + esc(FLAG_TIPS[f]) + '"' : '')
    + '>' + esc(flagLabel(f)) + '</span>';
  const KIND_LABELS = {
    target: 'target', pattern_rule: 'pattern rule', job: 'job',
    stage: 'stage', ghost: 'unresolved reference'
  };
  const EDGE_LABELS = {
    prerequisite: 'prerequisite', order_only: 'order-only', needs: 'needs',
    stage_order: 'stage order', includes: 'includes', invokes: 'invokes', extends: 'extends'
  };

  /* ==========================================================
     Small helpers
     ========================================================== */
  function esc(s) {
    if (s == null) return '';
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  // Middle truncation for identifiers: keep both ends.
  function midTrunc(s, max) {
    if (s.length <= max) return s;
    const head = Math.ceil((max - 1) * 0.6);
    const tail = max - 1 - head;
    return s.slice(0, head) + '…' + s.slice(s.length - tail);
  }

  // Path truncation: the tail matters most — drop leading segments.
  function midTruncPath(p, max) {
    if (p.length <= max) return p;
    const parts = p.split('/');
    let out = parts.pop() || p;
    while (parts.length && ('…/' + parts[parts.length - 1] + '/' + out).length <= max) {
      out = parts.pop() + '/' + out;
    }
    const result = '…/' + out;
    return result.length <= max + 2 ? result : '…' + p.slice(p.length - max + 1);
  }

  function locHtml(source, opts) {
    if (!source) return '';
    const full = source.file + ':' + source.line;
    const shown = midTruncPath(source.file, (opts && opts.max) || 34) + ':' + source.line;
    return '<span class="loc loc-link" role="link" tabindex="0" data-file="' + esc(source.file)
      + '" title="' + esc(full) + '">' + esc(shown) + '</span>';
  }

  function copyText(text, btn) {
    const done = () => {
      const prev = btn.textContent;
      btn.textContent = 'Copied';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = prev; btn.classList.remove('copied'); }, 1400);
    };
    const fallback = () => {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); done(); } catch (e) { /* leave button as-is */ }
      document.body.removeChild(ta);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, fallback);
    } else {
      fallback();
    }
  }

  function highlightMatch(label, query) {
    const idx = label.toLowerCase().indexOf(query.toLowerCase());
    if (idx < 0) return esc(label);
    return esc(label.slice(0, idx)) + '<mark>' + esc(label.slice(idx, idx + query.length))
      + '</mark>' + esc(label.slice(idx + query.length));
  }

  function fmtGenerated(iso) {
    if (!iso) return '';
    return iso.replace('T', ' ').replace('Z', ' UTC');
  }

  /* ==========================================================
     Header
     ========================================================== */
  // Report-level banner (GitLab workflow:rules pipeline gate).
  (function () {
    const ann = REPORT.annotations || {};
    const rules = ann.workflow_rules;
    if (!rules || !rules.length) return;
    const el = document.getElementById('report-banner');
    el.hidden = false;
    el.innerHTML = '<span class="diag-sev">ⓘ Pipeline gate</span>'
      + '<span class="wrap-any">'
      + (ann.workflow_name ? 'workflow "' + esc(ann.workflow_name) + '" — ' : '')
      + 'this pipeline runs only when: '
      + rules.map(r => '<code>' + esc(r) + '</code>').join(' · ')
      + '</span>';
  })();

  const headerRoot = document.getElementById('header-root');
  headerRoot.textContent = midTruncPath(REPORT.root || '', 52);
  headerRoot.title = REPORT.root || '';
  const FORMAT_LABELS = { gitlab_ci: 'GitLab CI', makefile: 'Make' };
  document.getElementById('header-format').textContent =
    FORMAT_LABELS[REPORT.format] || REPORT.format || 'unknown';
  document.getElementById('header-generated').textContent =
    'generated ' + fmtGenerated(REPORT.generated_at);

  // Diagnostics badge: severity-worded, click jumps to the flat list.
  const diagCounts = { info: 0, warning: 0, error: 0 };
  REPORT.diagnostics.forEach(d => { diagCounts[d.severity] = (diagCounts[d.severity] || 0) + 1; });
  const badgeEl = document.getElementById('diag-badge');
  const badgeParts = [];
  if (diagCounts.error) badgeParts.push(diagCounts.error + ' error' + (diagCounts.error > 1 ? 's' : ''));
  if (diagCounts.warning) badgeParts.push(diagCounts.warning + ' warning' + (diagCounts.warning > 1 ? 's' : ''));
  if (diagCounts.info) badgeParts.push(diagCounts.info + ' notice' + (diagCounts.info > 1 ? 's' : ''));
  if (badgeParts.length) {
    badgeEl.hidden = false;
    badgeEl.textContent = badgeParts.join(' · ');
    badgeEl.className = 'chip diag-badge chip-' +
      (diagCounts.error ? 'error' : diagCounts.warning ? 'warn' : 'info');
    badgeEl.setAttribute('data-tip', 'Show all diagnostics');
    badgeEl.addEventListener('click', () => {
      switchToView('filemap');
      const target = document.getElementById('diag-flat-list');
      if (target) {
        target.scrollIntoView({ block: 'start' });
        target.classList.remove('flash');
        void target.offsetWidth;
        target.classList.add('flash');
      }
    });
  }

  /* ==========================================================
     Theme toggle: system → light → dark, in memory only
     ========================================================== */
  const THEME_ORDER = ['system', 'light', 'dark'];
  const THEME_ICON = { system: '◑', light: '☀', dark: '☾' };
  let theme = 'system';
  const themeBtn = document.getElementById('theme-toggle');
  function applyTheme() {
    if (theme === 'system') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', theme);
    themeBtn.textContent = THEME_ICON[theme] + ' ' + theme.charAt(0).toUpperCase() + theme.slice(1);
    themeBtn.setAttribute('data-tip', 'Theme: ' + theme + ' — click to switch');
  }
  themeBtn.addEventListener('click', () => {
    theme = THEME_ORDER[(THEME_ORDER.indexOf(theme) + 1) % THEME_ORDER.length];
    applyTheme();
  });
  applyTheme();

  /* ==========================================================
     Tabs (real tablist, arrow-key navigable)
     ========================================================== */
  // What-If is a GitLab-only view: the tab exists only when the model
  // carries a compiled what-if program (presence-based, format-neutral).
  const WHATIF = (REPORT.annotations || {}).whatif || null;
  const whatifAvailable = !!(WHATIF && typeof PipeviewWhatIf !== 'undefined');
  if (whatifAvailable) document.getElementById('tab-whatif').hidden = false;

  const tabs = Array.from(document.querySelectorAll('.tab')).filter(t => !t.hidden);
  const views = Array.from(document.querySelectorAll('.view'));
  const viewScroll = {};   // per-view scroll memory
  let activeView = 'graph';

  function switchToView(name) {
    if (name === activeView) { syncTabs(name); return; }
    const cur = document.getElementById('view-' + activeView);
    const curBody = cur && cur.querySelector('.view-body');
    if (curBody) viewScroll[activeView] = curBody.scrollTop;
    activeView = name;
    views.forEach(v => v.classList.toggle('active', v.id === 'view-' + name));
    syncTabs(name);
    const next = document.getElementById('view-' + name);
    const nextBody = next && next.querySelector('.view-body');
    if (nextBody && viewScroll[name] != null) nextBody.scrollTop = viewScroll[name];
    if (name === 'graph') requestAnimationFrame(() => graph.onShown());
  }
  function syncTabs(name) {
    tabs.forEach(t => {
      const sel = t.dataset.view === name;
      t.setAttribute('aria-selected', sel ? 'true' : 'false');
      t.tabIndex = sel ? 0 : -1;
    });
  }
  tabs.forEach((tab, i) => {
    tab.addEventListener('click', () => switchToView(tab.dataset.view));
    tab.addEventListener('keydown', e => {
      let j = null;
      if (e.key === 'ArrowRight') j = (i + 1) % tabs.length;
      else if (e.key === 'ArrowLeft') j = (i - 1 + tabs.length) % tabs.length;
      else if (e.key === 'Home') j = 0;
      else if (e.key === 'End') j = tabs.length - 1;
      if (j != null) {
        e.preventDefault();
        tabs[j].focus();
        switchToView(tabs[j].dataset.view);
      }
    });
  });
  syncTabs('graph');

  document.getElementById('count-graph').textContent = REPORT.nodes.length ? ' ' + REPORT.nodes.length : '';
  document.getElementById('count-catalog').textContent = tasks.length ? ' ' + tasks.length : '';
  document.getElementById('count-variables').textContent = REPORT.variables.length ? ' ' + REPORT.variables.length : '';
  document.getElementById('count-filemap').textContent = REPORT.files.length ? ' ' + REPORT.files.length : '';

  /* ==========================================================
     Detail panel + splitter
     ========================================================== */
  const mainEl = document.getElementById('main');
  const panelEl = document.getElementById('detail-panel');
  const panelName = document.getElementById('panel-name');
  const panelBody = document.getElementById('panel-body');
  const splitterEl = document.getElementById('splitter');

  const PANEL_DEFAULT = 400, PANEL_MIN = 300;
  const panelMax = () => Math.min(720, Math.floor(window.innerWidth * 0.6));
  let panelWidth = PANEL_DEFAULT;   // session memory only — no localStorage

  function setPanelWidth(w) {
    panelWidth = Math.max(PANEL_MIN, Math.min(panelMax(), w));
    panelEl.style.width = panelWidth + 'px';
    splitterEl.setAttribute('aria-valuemin', String(PANEL_MIN));
    splitterEl.setAttribute('aria-valuemax', String(panelMax()));
    splitterEl.setAttribute('aria-valuenow', String(panelWidth));
  }
  function openPanel() {
    if (mainEl.classList.contains('panel-closed')) {
      mainEl.classList.remove('panel-closed');
      setPanelWidth(panelWidth);
    }
  }
  function closePanel() {
    mainEl.classList.add('panel-closed');
    clearRowSelection();
    graph.clearSelection();
  }
  document.getElementById('panel-close').addEventListener('click', closePanel);

  // Drag to resize.
  let dragging = false;
  splitterEl.addEventListener('pointerdown', e => {
    dragging = true;
    splitterEl.classList.add('dragging');
    splitterEl.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  splitterEl.addEventListener('pointermove', e => {
    if (!dragging) return;
    setPanelWidth(Math.round(window.innerWidth - e.clientX - splitterEl.offsetWidth / 2));
  });
  splitterEl.addEventListener('pointerup', e => {
    dragging = false;
    splitterEl.classList.remove('dragging');
    splitterEl.releasePointerCapture(e.pointerId);
  });
  splitterEl.addEventListener('dblclick', () => setPanelWidth(PANEL_DEFAULT));
  splitterEl.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft') { setPanelWidth(panelWidth + 16); e.preventDefault(); }
    else if (e.key === 'ArrowRight') { setPanelWidth(panelWidth - 16); e.preventDefault(); }
    else if (e.key === 'Home') { setPanelWidth(panelMax()); e.preventDefault(); }
    else if (e.key === 'End') { setPanelWidth(PANEL_MIN); e.preventDefault(); }
    else if (e.key === 'Enter') { setPanelWidth(PANEL_DEFAULT); e.preventDefault(); }
  });
  setPanelWidth(PANEL_DEFAULT);
  window.addEventListener('resize', () => setPanelWidth(panelWidth));

  function clearRowSelection() {
    document.querySelectorAll('tr.row-selected').forEach(tr => tr.classList.remove('row-selected'));
  }
  function markRowSelected(tr) {
    clearRowSelection();
    if (tr) tr.classList.add('row-selected');
  }

  /* ----------------------------------------------------------
     One panel anatomy for every node kind:
     identity → description → command → recipe → variables used
     → edges in/out → annotations
     ---------------------------------------------------------- */
  function varRefsInRecipe(node) {
    const found = [];
    const seen = new Set();
    const text = (node.recipe || []).join('\n');
    const re = /\$[({]([A-Za-z_][A-Za-z0-9_]*)[)}]|\$([A-Za-z_][A-Za-z0-9_]*)/g;
    let m;
    while ((m = re.exec(text)) !== null) {
      const name = m[1] || m[2];
      if (varMap[name] && !seen.has(name)) { seen.add(name); found.push(name); }
    }
    return found;
  }

  // Automatic variables: recognized, tooltipped with their meaning, and never
  // treated as user variables. Keys are the raw (pre-escape) glyphs.
  const AUTO_VAR_TIPS = {
    '@': 'the target of this rule',
    '<': 'the first prerequisite',
    '^': 'all prerequisites (duplicates removed)',
    '?': 'prerequisites newer than the target',
    '*': 'the pattern stem (% match)',
    '+': 'all prerequisites, duplicates kept',
    '|': 'the order-only prerequisites'
  };
  function markAutoVars(escapedLine) {
    // runs on escaped text, so `<` appears as `&lt;`
    return escapedLine.replace(/\$\((@|&lt;|\^|\?|\*|\+|\|)([DF])\)|\$(@|&lt;|\^|\?|\*|\+|\|)/g,
      (match, pg, pdf, bare) => {
        const glyph = (pg || bare) === '&lt;' ? '<' : (pg || bare);
        let tip = AUTO_VAR_TIPS[glyph] || '';
        if (pdf === 'D') tip = 'directory part of ' + tip;
        if (pdf === 'F') tip = 'file part of ' + tip;
        return '<span class="auto-var" title="automatic variable — ' + esc(tip) + '">' + match + '</span>';
      });
  }

  function linkifyVarRefs(escapedLine) {
    const linked = escapedLine.replace(/\$[({]([A-Za-z_][A-Za-z0-9_.\-]*)[)}]|\$([A-Za-z_][A-Za-z0-9_]*)/g,
      (match, g1, g2) => {
        const name = g1 || g2;
        if (!varMap[name]) return match;
        return '<span class="var-ref" role="link" tabindex="0" data-var="' + esc(name) + '">' + match + '</span>';
      });
    return markAutoVars(linked);
  }

  // Recipe-line prefixes @ / - / + (Make): strip nothing, explain on hover.
  const RECIPE_PREFIX_TIPS = {
    '@': '@ — this line is not echoed',
    '-': '- — errors from this line are ignored',
    '+': "+ — runs even under 'make -n' (dry run)"
  };
  function markRecipePrefixes(escapedLine) {
    return escapedLine.replace(/^([@+-]+)/, run =>
      run.split('').map(ch =>
        '<span class="recipe-prefix" title="' + esc(RECIPE_PREFIX_TIPS[ch] || ch) + '">' + ch + '</span>'
      ).join(''));
  }

  function invocationFor(node) {
    if (node.kind === 'target') return 'make ' + node.name;
    if (node.kind === 'job') return node.name;
    return null;
  }

  function showNodeDetail(nodeId, opts) {
    const node = nodeMap[nodeId];
    if (!node) return;
    openPanel();
    panelName.textContent = node.name;
    panelName.title = node.name;

    let html = '';
    // identity
    html += '<div class="panel-section"><div class="panel-idrow">'
      + '<span class="chip ' + (node.kind === 'ghost' ? 'chip-ghost' : 'chip-accent') + '">'
      + esc(KIND_LABELS[node.kind] || node.kind) + '</span>'
      + (node.flags || []).map(flagChip).join('')
      + '</div>'
      + (node.source ? '<div class="value">' + locHtml(node.source) + '</div>' : '')
      + '</div>';

    if (node.kind === 'ghost') {
      const ref = node.annotations && node.annotations.external_reference;
      html += '<div class="panel-section"><div class="value wrap-any" style="color:var(--text-muted)">'
        + (ref
            ? 'Referenced via <code>' + esc(ref) + '</code> but defined outside the '
              + 'parsed files — most likely in an include pipeview cannot fetch. '
              + 'The referencing job still parsed completely.'
            : 'This name is referenced as a dependency but never defined in the parsed files. '
              + 'It may be a real file on disk, or a missing rule.')
        + '</div></div>';
    }

    if (node.doc) {
      html += '<div class="panel-section"><h3>Description</h3>'
        + '<div class="value wrap-any">' + esc(node.doc) + '</div></div>';
    }

    const inv = invocationFor(node);
    if (inv && isTask(node)) {
      html += '<div class="panel-section"><h3>' + (node.kind === 'job' ? 'Job name' : 'Run')
        + '<span class="section-action"><button class="btn copy-btn" data-copy="' + esc(inv) + '">Copy</button></span></h3>'
        + '<div class="codeblock soft-wrap">' + esc(inv) + '</div></div>';
    }

    if (node.recipe && node.recipe.length) {
      const hasPrefixes = node.annotations && node.annotations.recipe_prefixes;
      const oneshell = node.annotations && node.annotations.oneshell;
      html += '<div class="panel-section"><h3>' + (node.kind === 'job' ? 'Script' : 'Recipe')
        + (oneshell ? ' <span class="chip" data-tip=".ONESHELL — all lines run in one shell invocation, not one shell per line">one shell</span>' : '')
        + '<span class="section-action">'
        + '<button class="btn btn-quiet wrap-toggle" aria-pressed="false" data-tip="Toggle soft wrapping">Wrap</button>'
        + '</span></h3>'
        + '<div class="codeblock">' + node.recipe.map(r => {
            let line = linkifyVarRefs(esc(r));
            if (hasPrefixes) line = markRecipePrefixes(line);
            return line;
          }).join('\n') + '</div></div>';
    }

    const usedVars = varRefsInRecipe(node);
    if (usedVars.length) {
      html += '<div class="panel-section"><h3>Variables used</h3><div class="value">'
        + usedVars.map(name =>
            '<a class="var-link" role="link" tabindex="0" data-var="' + esc(name) + '"><code>$(' + esc(name) + ')</code></a>'
          ).join(', ')
        + '</div></div>';
    }

    const outEdges = REPORT.edges.filter(e => e.src === nodeId);
    const inEdges = REPORT.edges.filter(e => e.dst === nodeId);
    const edgeItem = e => {
      const other = e.src === nodeId ? e.dst : e.src;
      const target = nodeMap[other]
        ? '<a class="node-link edge-target clip" role="link" tabindex="0" data-id="' + esc(other) + '" title="' + esc(other) + '">' + esc(other) + '</a>'
        : (filePaths.has(other)
            ? '<span class="loc loc-link edge-target" role="link" tabindex="0" data-file="' + esc(other) + '" title="' + esc(other) + '">' + esc(midTruncPath(other, 40)) + '</span>'
            : '<span class="edge-target clip" title="' + esc(other) + '">' + esc(other) + '</span>');
      return '<li>' + target + '<span class="chip">' + esc(EDGE_LABELS[e.kind] || e.kind) + '</span></li>';
    };
    if (outEdges.length) {
      html += '<div class="panel-section"><h3>Depends on</h3><ul class="edge-list">'
        + outEdges.map(edgeItem).join('') + '</ul></div>';
    }
    if (inEdges.length) {
      html += '<div class="panel-section"><h3>Depended on by</h3><ul class="edge-list">'
        + inEdges.map(edgeItem).join('') + '</ul></div>';
    }

    // recipe_prefixes/oneshell are surfaced inline on the recipe itself.
    const detailKeys = Object.keys(node.annotations || {})
      .filter(k => k !== 'recipe_prefixes' && k !== 'oneshell');
    if (detailKeys.length) {
      const annValue = v => {
        if (Array.isArray(v)) return v.map(x => esc(String(x))).join('<br>');
        if (v && typeof v === 'object') {
          return Object.keys(v).map(k2 => {
            const inner = v[k2];
            const shownInner = (inner && typeof inner === 'object')
              ? Object.keys(inner).map(k3 => esc(k3) + ': ' + esc(
                  Array.isArray(inner[k3]) ? inner[k3].join(', ') : String(inner[k3])
                )).join('; ')
              : esc(Array.isArray(inner) ? inner.join(', ') : String(inner));
            return esc(k2.replace(/_/g, ' ')) + ': ' + shownInner;
          }).join('<br>');
        }
        return esc(String(v));
      };
      html += '<div class="panel-section"><h3>Details</h3><dl class="kv-list">';
      detailKeys.forEach(k => {
        html += '<dt>' + esc(k.replace(/_/g, ' ')) + '</dt><dd class="wrap-any">'
          + annValue(node.annotations[k]) + '</dd>';
      });
      html += '</dl></div>';
    }

    if (nodeMap[nodeId] && graph.hasNode(nodeId)) {
      html += '<div class="panel-section"><button class="btn" id="panel-show-in-graph">Show in graph</button></div>';
    }

    panelBody.innerHTML = html;
    panelBody.scrollTop = 0;
    wirePanel();
    const showBtn = document.getElementById('panel-show-in-graph');
    if (showBtn) showBtn.addEventListener('click', () => { switchToView('graph'); graph.revealNode(nodeId); });
    if (!opts || !opts.keepGraphSelection) graph.setSelected(nodeId, { focus: false });
  }

  /* ----------------------------------------------------------
     Variable detail: value, the event timeline (signature
     element), and used-by links — round trips back to nodes.
     ---------------------------------------------------------- */
  function effectiveValue(evt) {
    return evt.resolved_value != null ? evt.resolved_value : evt.raw_value;
  }

  const ORIGIN_TIPS = {
    'makefile': 'assigned in a makefile',
    'environment': 'value comes from the environment make runs in',
    'command line': 'set on the make command line — beats makefile assignments (except override)',
    'default': "one of make's built-in default variables",
    'built-in default': "referenced but never assigned here — make supplies a built-in default",
    'automatic': 'computed by make per rule',
    'override': 'set with the override directive — beats command-line values',
    'predefined': 'provided by the GitLab runner for every job'
  };

  // Event-level semantics carried in annotations: shown as small chips /
  // notes on the timeline event.
  function eventAnnotationsHtml(evt) {
    const a = evt.annotations || {};
    let chips = '';
    if (a.export) chips += '<span class="chip chip-ok" data-tip="this assignment also exports the variable to recipe environments">exported</span>';
    if (a.unexported) chips += '<span class="chip" data-tip="removed from recipe environments">unexported</span>';
    if (a.override) chips += '<span class="chip chip-warn" data-tip="override directive — this assignment beats values given on the command line">override</span>';
    if (a.private) chips += '<span class="chip" data-tip="private — not inherited by the target’s prerequisites">private</span>';
    if (a.define) chips += '<span class="chip" data-tip="multi-line define … endef block">define</span>';
    if (a.undefine) chips += '<span class="chip chip-warn" data-tip="undefine — the variable is removed from this point on">undefine</span>';
    if (a.shell_assignment) chips += '<span class="chip" data-tip="!= shell assignment — the value is this command’s output at run time; pipeview never executes it">shell</span>';
    if (a.computed_name) chips += '<span class="chip chip-warn" data-tip="the variable’s name is itself computed at run time">computed name</span>';
    if (a.matrix_axis) chips += '<span class="chip chip-info" data-tip="parallel:matrix axis — each listed value becomes one job">matrix axis</span>';
    let notes = '';
    if (a.condition) notes += '<div class="tl-note">under condition: <code>' + esc(a.condition) + '</code></div>';
    if (a.pattern) notes += '<div class="tl-note">applies to targets matching <code>' + esc(a.pattern) + '</code></div>';
    if (a.propagates_to_prereqs) notes += '<div class="tl-note" data-tip="target-specific values are inherited by the target’s prerequisites — a frequent surprise">also applies to this target’s prerequisites</div>';
    if (a.inherited_from) notes += '<div class="tl-note">inherited via extends from <code>' + esc(a.inherited_from) + '</code></div>';
    if (a.rule) notes += '<div class="tl-note">only when rule matches: <code>' + esc(a.rule) + '</code></div>';
    if (a.yaml_coercion) notes += '<div class="tl-note">' + esc(a.yaml_coercion) + ' — GitLab passes the quoted string shown here</div>';
    if (a.via_reference) notes += '<div class="tl-note">value spliced from <code>' + esc(a.via_reference) + '</code></div>';
    if (a.external_reference) notes += '<div class="tl-note">value defined externally via <code>' + esc(a.external_reference) + '</code></div>';
    if (a.description) notes += '<div class="tl-note">description: ' + esc(a.description) + '</div>';
    return { chips: chips, notes: notes };
  }

  function showVarDetail(varName) {
    const v = varMap[varName];
    if (!v) return;
    openPanel();
    panelName.textContent = '$(' + v.name + ')';
    panelName.title = '$(' + v.name + ')';

    let html = '';
    const last = v.events.length ? v.events[v.events.length - 1] : null;
    html += '<div class="panel-section"><div class="panel-idrow">'
      + '<span class="chip chip-accent">variable</span>'
      + (v.exported ? '<span class="chip chip-ok" data-tip="passed into recipe environments">exported</span>' : '')
      + (v.origin ? '<span class="chip chip-info" data-tip="' + esc(ORIGIN_TIPS[v.origin] || '') + '">' + esc(v.origin) + '</span>' : '')
      + (last || v.origin ? '' : '<span class="chip chip-warn">unresolved</span>')
      + '</div></div>';

    if (last) {
      html += '<div class="panel-section"><h3>Current value'
        + '<span class="section-action"><button class="btn copy-btn" data-copy="' + esc(effectiveValue(last)) + '">Copy</button></span></h3>'
        + '<div class="codeblock soft-wrap">' + esc(effectiveValue(last)) + '</div></div>';
    } else if (v.origin === 'built-in default' || v.origin === 'default') {
      html += '<div class="panel-section"><div class="value" style="color:var(--text-muted)">'
        + 'Never assigned in the parsed files — make supplies a built-in default for this variable.</div></div>';
    } else if (v.origin === 'predefined') {
      html += '<div class="panel-section"><div class="value" style="color:var(--text-muted)">'
        + 'A GitLab predefined variable: the runner provides its value for every job.</div></div>';
    } else if (v.origin === 'environment') {
      html += '<div class="panel-section"><div class="value" style="color:var(--text-muted)">'
        + 'The value comes from the environment make runs in.</div></div>';
    } else {
      html += '<div class="panel-section"><div class="value" style="color:var(--text-muted)">'
        + 'No assignment was found in the parsed files. The value likely comes from the '
        + 'environment or the CI runner at execution time.</div></div>';
    }

    if (v.events.length) {
      html += '<div class="panel-section"><h3>History</h3><ol class="timeline">';
      v.events.forEach((evt, i) => {
        const prev = i > 0 ? effectiveValue(v.events[i - 1]) : null;
        const cur = effectiveValue(evt);
        const isFinal = i === v.events.length - 1;
        const ann = eventAnnotationsHtml(evt);
        html += '<li class="tl-event' + (isFinal ? ' tl-final' : '') + '">'
          + '<div class="tl-head">'
          + '<span class="op-badge">' + esc(evt.operator) + '</span>'
          + ann.chips
          + '<span class="tl-scope">' + esc(evt.scope) + '</span>'
          + locHtml(evt.source, { max: 26 })
          + '</div>';
        if (prev != null && prev !== cur) {
          html += '<div class="tl-diff"><del title="previous value">' + esc(prev)
            + '</del><span class="tl-arrow">→</span><ins title="new value">' + esc(cur) + '</ins></div>';
        } else {
          html += '<div class="tl-value">' + esc(evt.raw_value) + '</div>';
          if (evt.resolved_value != null && evt.resolved_value !== evt.raw_value) {
            html += '<div class="tl-diff"><span class="tl-arrow">resolves to</span> <ins>' + esc(evt.resolved_value) + '</ins></div>';
          }
        }
        html += ann.notes;
        html += '</li>';
      });
      html += '</ol></div>';
    }

    if (v.used_by && v.used_by.length) {
      html += '<div class="panel-section"><h3>Used by</h3><ul class="edge-list">'
        + v.used_by.map(u => nodeMap[u]
            ? '<li><a class="node-link edge-target clip" role="link" tabindex="0" data-id="' + esc(u) + '" title="' + esc(u) + '">' + esc(u) + '</a></li>'
            : '<li><span class="edge-target clip" title="' + esc(u) + '">' + esc(u) + '</span></li>'
          ).join('')
        + '</ul></div>';
    }

    panelBody.innerHTML = html;
    panelBody.scrollTop = 0;
    wirePanel();
  }

  // Wire the delegated interactions inside the panel once per render.
  function wirePanel() {
    panelBody.querySelectorAll('.node-link').forEach(el => {
      const go = () => showNodeDetail(el.dataset.id);
      el.addEventListener('click', go);
      el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
    });
    panelBody.querySelectorAll('.var-link, .var-ref').forEach(el => {
      const go = () => showVarDetail(el.dataset.var);
      el.addEventListener('click', go);
      el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
    });
    panelBody.querySelectorAll('.copy-btn').forEach(btn => {
      btn.addEventListener('click', e => { e.stopPropagation(); copyText(btn.dataset.copy, btn); });
    });
    panelBody.querySelectorAll('.wrap-toggle').forEach(btn => {
      btn.addEventListener('click', () => {
        const block = btn.closest('.panel-section').querySelector('.codeblock');
        const on = block.classList.toggle('soft-wrap');
        btn.setAttribute('aria-pressed', on ? 'true' : 'false');
      });
    });
    wireLocLinks(panelBody);
  }

  function wireLocLinks(rootEl) {
    rootEl.querySelectorAll('.loc-link').forEach(el => {
      const go = () => revealFile(el.dataset.file);
      el.addEventListener('click', go);
      el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
    });
  }

  function revealFile(path) {
    switchToView('filemap');
    const row = document.querySelector('.file-row[data-path="' + CSS.escape(path) + '"]');
    if (!row) return;
    let d = row.closest('details');
    while (d) { d.open = true; d = d.parentElement ? d.parentElement.closest('details') : null; }
    row.scrollIntoView({ block: 'center' });
    row.classList.remove('flash');
    void row.offsetWidth;
    row.classList.add('flash');
  }

  /* ==========================================================
     Graph view
     ========================================================== */
  const EDGE_DASH = {
    prerequisite: '', needs: '',
    order_only: '8 4', extends: '8 4',
    stage_order: '4 4',
    includes: '2 4',
    invokes: '12 4 2 4'
  };
  const edgeVar = kind => 'var(--edge-' + kind.replace(/_/g, '-') + ')';

  const graph = (function () {
    const svg = document.getElementById('graph-svg');
    const container = document.getElementById('graph-container');
    const zoomLevelEl = document.getElementById('zoom-level');
    const emptyEl = document.getElementById('graph-empty');
    const noteEl = document.getElementById('graph-note');

    let scale = 1, tx = 0, ty = 0;
    let layoutW = 0, layoutH = 0;
    let nodePos = {};            // id -> {x, y}
    let rootG = null;
    let selectedId = null;
    let focusId = null;
    const hiddenKinds = new Set();
    let laidOut = false;

    const kindsPresent = Array.from(new Set(graphEdges.map(e => e.kind)));
    noteEl.textContent = REPORT.nodes.length + ' node' + (REPORT.nodes.length === 1 ? '' : 's')
      + ' · ' + graphEdges.length + ' edge' + (graphEdges.length === 1 ? '' : 's');

    // Legend doubles as the edge-kind filter — one list, one place.
    const legendBody = document.getElementById('legend-body');
    kindsPresent.forEach(kind => {
      const label = document.createElement('label');
      label.className = 'legend-item';
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = true;
      cb.setAttribute('aria-label', 'Show ' + (EDGE_LABELS[kind] || kind) + ' edges');
      cb.addEventListener('change', () => {
        if (cb.checked) hiddenKinds.delete(kind); else hiddenKinds.add(kind);
        layout();
      });
      const dash = EDGE_DASH[kind] || '';
      label.appendChild(cb);
      label.insertAdjacentHTML('beforeend',
        '<svg width="28" height="8" aria-hidden="true"><line x1="1" y1="4" x2="27" y2="4" stroke="'
        + edgeVar(kind) + '" stroke-width="2"' + (dash ? ' stroke-dasharray="' + dash + '"' : '') + '/></svg>'
        + '<span>' + esc(EDGE_LABELS[kind] || kind) + '</span>');
      legendBody.appendChild(label);
    });
    if (REPORT.nodes.some(n => n.kind === 'ghost')) {
      legendBody.insertAdjacentHTML('beforeend',
        '<div class="legend-note"><span class="sample-ghost"></span>dashed = referenced but never defined</div>');
    }
    if (kindsPresent.length) document.getElementById('graph-legend').open = true;

    function layout() {
      if (typeof dagre === 'undefined' || !REPORT.nodes.length) {
        emptyEl.hidden = REPORT.nodes.length > 0;
        svg.innerHTML = '';
        laidOut = true;
        return;
      }
      emptyEl.hidden = true;

      const g = new dagre.graphlib.Graph();
      g.setGraph({ rankdir: 'LR', nodesep: 28, ranksep: 72, marginx: 24, marginy: 24 });
      g.setDefaultEdgeLabel(() => ({}));

      REPORT.nodes.forEach(n => {
        const label = midTrunc(n.name, 26);
        g.setNode(n.id, { label: label, width: Math.max(96, label.length * 7 + 26), height: 34 });
      });
      const visEdges = graphEdges.filter(e => !hiddenKinds.has(e.kind));
      visEdges.forEach(e => g.setEdge(e.src, e.dst, { kind: e.kind }));

      dagre.layout(g);
      const gr = g.graph();
      layoutW = gr.width || 800;
      layoutH = gr.height || 600;
      nodePos = {};

      let defs = '<defs>';
      kindsPresent.forEach(kind => {
        defs += '<marker id="arrow-' + kind + '" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">'
          + '<polygon points="0 0,8 3.5,0 7" fill="' + edgeVar(kind) + '"/></marker>';
      });
      defs += '</defs>';

      let edgesSvg = '<g class="edges">';
      g.edges().forEach(e => {
        const edge = g.edge(e);
        const kind = edge.kind || 'prerequisite';
        const pts = edge.points || [];
        if (pts.length < 2) return;
        let d = 'M' + pts[0].x + ',' + pts[0].y;
        for (let i = 1; i < pts.length; i++) d += ' L' + pts[i].x + ',' + pts[i].y;
        const dash = EDGE_DASH[kind] || '';
        edgesSvg += '<path class="graph-edge" d="' + d + '" stroke="' + edgeVar(kind) + '"'
          + (dash ? ' stroke-dasharray="' + dash + '"' : '')
          + ' marker-end="url(#arrow-' + kind + ')" data-src="' + esc(e.v) + '" data-dst="' + esc(e.w) + '">'
          + '<title>' + esc(e.v) + ' → ' + esc(e.w) + ' (' + esc(EDGE_LABELS[kind] || kind) + ')</title></path>';
      });
      edgesSvg += '</g>';

      let nodesSvg = '<g class="nodes">';
      g.nodes().forEach(nid => {
        const lo = g.node(nid);
        const node = nodeMap[nid];
        if (!node || !lo) return;
        nodePos[nid] = { x: lo.x, y: lo.y };
        const x = lo.x - lo.width / 2, y = lo.y - lo.height / 2;
        const rx = node.kind === 'stage' ? lo.height / 2 : 5;
        const cls = 'graph-node kind-' + node.kind + (isTask(node) ? ' is-task' : '');
        nodesSvg += '<g class="' + cls + '" data-id="' + esc(nid) + '" tabindex="-1">'
          + '<title>' + esc(node.name) + ' (' + esc(KIND_LABELS[node.kind] || node.kind) + ')</title>'
          + '<rect x="' + x + '" y="' + y + '" width="' + lo.width + '" height="' + lo.height + '" rx="' + rx + '"/>'
          + '<text x="' + lo.x + '" y="' + (lo.y + 4) + '" text-anchor="middle">' + esc(lo.label) + '</text>'
          + '</g>';
      });
      nodesSvg += '</g>';

      svg.innerHTML = '<g id="graph-root">' + defs + edgesSvg + nodesSvg + '</g>';
      rootG = document.getElementById('graph-root');

      svg.querySelectorAll('.graph-node').forEach(el => {
        el.addEventListener('click', ev => {
          ev.stopPropagation();
          setSelected(el.dataset.id, { focus: true });
          showNodeDetail(el.dataset.id, { keepGraphSelection: true });
        });
      });

      if (!laidOut) fit();
      laidOut = true;
      applyStates();
      applyTransform();
    }

    function applyTransform() {
      if (rootG) rootG.setAttribute('transform', 'translate(' + tx + ',' + ty + ') scale(' + scale + ')');
      zoomLevelEl.textContent = Math.round(scale * 100) + '%';
    }

    function clampScale(s) { return Math.max(0.08, Math.min(4, s)); }

    function fit() {
      const cw = container.clientWidth || 800, ch = container.clientHeight || 600;
      scale = clampScale(Math.min(cw / layoutW, ch / layoutH, 1.5) * 0.94);
      tx = (cw - layoutW * scale) / 2;
      ty = (ch - layoutH * scale) / 2;
      applyTransform();
    }
    function reset() {
      const cw = container.clientWidth, ch = container.clientHeight;
      scale = 1;
      tx = (cw - layoutW) / 2;
      ty = (ch - layoutH) / 2;
      applyTransform();
    }
    function zoomAt(px, py, factor) {
      const wx = (px - tx) / scale, wy = (py - ty) / scale;
      scale = clampScale(scale * factor);
      tx = px - wx * scale;
      ty = py - wy * scale;
      applyTransform();
    }

    document.getElementById('zoom-in').addEventListener('click', () =>
      zoomAt(container.clientWidth / 2, container.clientHeight / 2, 1.25));
    document.getElementById('zoom-out').addEventListener('click', () =>
      zoomAt(container.clientWidth / 2, container.clientHeight / 2, 0.8));
    document.getElementById('zoom-fit').addEventListener('click', fit);
    document.getElementById('zoom-reset').addEventListener('click', reset);

    // Pan by dragging empty canvas.
    let panning = false, sx = 0, sy = 0;
    container.addEventListener('pointerdown', e => {
      if (e.target.closest('.graph-node') || e.target.closest('.graph-controls')
        || e.target.closest('.graph-legend')) return;
      panning = true;
      sx = e.clientX - tx; sy = e.clientY - ty;
      container.setPointerCapture(e.pointerId);
    });
    container.addEventListener('pointermove', e => {
      if (!panning) return;
      tx = e.clientX - sx; ty = e.clientY - sy;
      applyTransform();
    });
    container.addEventListener('pointerup', e => {
      panning = false;
      if (container.hasPointerCapture(e.pointerId)) container.releasePointerCapture(e.pointerId);
    });

    container.addEventListener('wheel', e => {
      e.preventDefault();
      const r = container.getBoundingClientRect();
      zoomAt(e.clientX - r.left, e.clientY - r.top, e.deltaY < 0 ? 1.12 : 0.89);
    }, { passive: false });

    // Click empty canvas: clear focus + selection.
    svg.addEventListener('click', e => {
      if (!e.target.closest('.graph-node')) clearSelection();
    });

    // Keep the viewport center stable when the container resizes
    // (panel drag, window resize) — resizing must not break the graph.
    if (typeof ResizeObserver !== 'undefined') {
      let lastW = 0, lastH = 0;
      new ResizeObserver(() => {
        const w = container.clientWidth, h = container.clientHeight;
        if (!w || !h || !laidOut) { lastW = w; lastH = h; return; }
        if (lastW) {
          tx += (w - lastW) / 2;
          ty += (h - lastH) / 2;
          applyTransform();
        }
        lastW = w; lastH = h;
      }).observe(container);
    }

    function reachableFrom(startId) {
      const seen = new Set();
      const queue = [startId];
      const visEdges = graphEdges.filter(e => !hiddenKinds.has(e.kind));
      while (queue.length) {
        const cur = queue.shift();
        if (seen.has(cur)) continue;
        seen.add(cur);
        visEdges.forEach(e => { if (e.src === cur) queue.push(e.dst); });
      }
      return seen;
    }

    function applyStates() {
      const focusSet = focusId ? reachableFrom(focusId) : null;
      svg.querySelectorAll('.graph-node').forEach(el => {
        el.classList.toggle('selected', el.dataset.id === selectedId);
        el.classList.toggle('dimmed', !!focusSet && !focusSet.has(el.dataset.id));
      });
      svg.querySelectorAll('.graph-edge').forEach(el => {
        el.classList.toggle('dimmed',
          !!focusSet && !(focusSet.has(el.dataset.src) && focusSet.has(el.dataset.dst)));
      });
    }

    function setSelected(id, opts) {
      selectedId = id;
      focusId = (opts && opts.focus) ? id : (id ? focusId : null);
      if (!id) focusId = null;
      applyStates();
    }
    function clearSelection() {
      selectedId = null;
      focusId = null;
      applyStates();
    }

    // Pan/zoom a node into view — selection is never off-canvas.
    function revealNode(id) {
      const run = () => {
        const pos = nodePos[id];
        if (!pos) return;
        const cw = container.clientWidth, ch = container.clientHeight;
        scale = clampScale(Math.max(0.75, Math.min(scale, 1.5)));
        tx = cw / 2 - pos.x * scale;
        ty = ch / 2 - pos.y * scale;
        applyTransform();
        setSelected(id, { focus: false });
        const el = svg.querySelector('.graph-node[data-id="' + CSS.escape(id) + '"]');
        if (el) el.focus({ preventScroll: true });
      };
      if (!laidOut) requestAnimationFrame(run); else run();
    }

    function onShown() {
      if (!laidOut) layout();
      else if (!container.clientWidth) requestAnimationFrame(onShown);
    }

    return {
      layout, fit, revealNode, setSelected, clearSelection, onShown,
      hasNode: id => !!nodeMap[id]
    };
  })();

  /* ==========================================================
     Tasks view
     ========================================================== */
  const catalogBody = document.getElementById('catalog-body');
  let catalogSort = { dir: 1 };

  function renderCatalog() {
    document.getElementById('catalog-note').textContent = tasks.length
      ? tasks.length + ' runnable task' + (tasks.length === 1 ? '' : 's')
      : '';
    if (!tasks.length) {
      catalogBody.innerHTML = '<div class="empty"><div class="empty-title">No tasks found</div>'
        + '<p>Nothing in this pipeline is marked as runnable — no phony make targets and no CI jobs. '
        + 'File-producing rules still appear in the graph view.</p></div>';
      return;
    }
    const rows = tasks.slice().sort((a, b) => catalogSort.dir * a.name.localeCompare(b.name));
    const isMake = REPORT.format === 'makefile';
    let html = '<table class="data-table">'
      + '<colgroup><col style="width:22%"><col style="width:36%"><col style="width:24%"><col style="width:10%"><col style="width:88px"></colgroup>'
      + '<thead><tr>'
      + '<th aria-sort="' + (catalogSort.dir === 1 ? 'ascending' : 'descending') + '">'
      + '<button class="sort-btn" id="catalog-sort">Name<span class="sort-arrow">'
      + (catalogSort.dir === 1 ? '▲' : '▼') + '</span></button></th>'
      + '<th>Description</th><th>' + (isMake ? 'Run' : 'Job') + '</th><th>Flags</th><th></th>'
      + '</tr></thead><tbody>';
    rows.forEach(n => {
      const inv = invocationFor(n) || n.name;
      const doc = n.doc
        ? '<span class="clip" style="display:block" title="' + esc(n.doc) + '">' + esc(n.doc) + '</span>'
        : (isMake
            ? 'No description yet — a <code>##</code> comment above the rule will appear here.'
            : 'No description.');
      const flags = (n.flags || []).map(flagChip).join(' ');
      html += '<tr data-id="' + esc(n.id) + '" tabindex="0">'
        + '<td class="cell-name"><span class="clip" style="display:block" title="' + esc(n.name) + '">' + esc(n.name) + '</span></td>'
        + '<td class="cell-doc' + (n.doc ? '' : ' no-doc') + '">' + doc + '</td>'
        + '<td><span class="invocation clip" style="display:inline-block;max-width:100%;vertical-align:middle" title="' + esc(inv) + '">' + esc(inv) + '</span></td>'
        + '<td>' + flags + '</td>'
        + '<td><button class="btn copy-btn" data-copy="' + esc(inv) + '" aria-live="polite" '
        + 'data-tip="' + (isMake ? 'Copy command' : 'Copy job name') + '">Copy</button></td>'
        + '</tr>';
    });
    html += '</tbody></table>';
    catalogBody.innerHTML = html;

    catalogBody.querySelectorAll('tr[data-id]').forEach(tr => {
      const open = () => { markRowSelected(tr); showNodeDetail(tr.dataset.id); };
      tr.addEventListener('click', e => { if (!e.target.closest('button')) open(); });
      tr.addEventListener('keydown', e => {
        if ((e.key === 'Enter' || e.key === ' ') && !e.target.closest('button')) { e.preventDefault(); open(); }
      });
    });
    catalogBody.querySelectorAll('.copy-btn').forEach(btn => {
      btn.addEventListener('click', e => { e.stopPropagation(); copyText(btn.dataset.copy, btn); });
    });
    const sortBtn = document.getElementById('catalog-sort');
    if (sortBtn) sortBtn.addEventListener('click', () => { catalogSort.dir *= -1; renderCatalog(); });
  }

  /* ==========================================================
     Variables view
     ========================================================== */
  const variablesBody = document.getElementById('variables-body');
  let varSort = { key: 'name', dir: 1 };
  let varFilter = '';

  function varCurrentValue(v) {
    if (!v.events.length) return null;
    return effectiveValue(v.events[v.events.length - 1]);
  }

  function renderVariables() {
    document.getElementById('variables-note').textContent = REPORT.variables.length
      ? REPORT.variables.length + ' variable' + (REPORT.variables.length === 1 ? '' : 's')
      : '';
    if (!REPORT.variables.length) {
      variablesBody.innerHTML = '<div class="empty"><div class="empty-title">No variables found</div>'
        + '<p>This pipeline defines no variables in the parsed files. Values may still arrive '
        + 'from the environment at run time.</p></div>';
      return;
    }
    let rows = REPORT.variables.slice();
    if (varFilter) rows = rows.filter(v => v.name.toLowerCase().includes(varFilter));
    const cmp = {
      name: (a, b) => a.name.localeCompare(b.name),
      events: (a, b) => a.events.length - b.events.length,
      used: (a, b) => a.used_by.length - b.used_by.length
    }[varSort.key];
    rows.sort((a, b) => varSort.dir * cmp(a, b));

    const sortTh = (key, label, extra) => {
      const active = varSort.key === key;
      return '<th' + (extra || '') + (active ? ' aria-sort="' + (varSort.dir === 1 ? 'ascending' : 'descending') + '"' : '') + '>'
        + '<button class="sort-btn" data-sort="' + key + '">' + label
        + (active ? '<span class="sort-arrow">' + (varSort.dir === 1 ? '▲' : '▼') + '</span>' : '')
        + '</button></th>';
    };

    let html = '<table class="data-table">'
      + '<colgroup><col style="width:28%"><col style="width:48%"><col style="width:12%"><col style="width:12%"></colgroup>'
      + '<thead><tr>'
      + sortTh('name', 'Name')
      + '<th>Value</th>'
      + sortTh('events', 'Events', ' class="num"')
      + sortTh('used', 'Used by', ' class="num"')
      + '</tr></thead><tbody>';

    rows.forEach(v => {
      const val = varCurrentValue(v);
      // A variable make/GitLab itself supplies is not "unresolved" — its
      // origin chip says where the value actually comes from.
      const valCell = val == null
        ? (v.origin
            ? '<span class="chip chip-info" data-tip="' + esc(ORIGIN_TIPS[v.origin] || 'value supplied by the tool') + '">' + esc(v.origin) + '</span>'
            : '<span class="chip chip-warn" data-tip="No assignment found in the parsed files; the value likely arrives from the environment at run time">unresolved</span>')
        : '<span class="clip" style="display:block" title="' + esc(val) + '"><code>' + esc(val) + '</code></span>';
      const nameChips =
        (v.exported ? ' <span class="chip chip-ok" title="exported — passed into recipe environments">exported</span>' : '')
        + (v.origin && val != null ? ' <span class="chip chip-info" title="' + esc(ORIGIN_TIPS[v.origin] || '') + '">' + esc(v.origin) + '</span>' : '');
      html += '<tr data-var="' + esc(v.name) + '" tabindex="0">'
        + '<td class="cell-name"><span style="display:flex;align-items:center;gap:6px;min-width:0">'
        + '<span class="clip" title="' + esc(v.name) + '"><code>' + esc(v.name) + '</code></span>' + nameChips + '</span></td>'
        + '<td class="cell-value">' + valCell + '</td>'
        + '<td class="num">' + v.events.length + '</td>'
        + '<td class="num">' + v.used_by.length + '</td>'
        + '</tr>';
    });
    html += '</tbody></table>';

    if (!rows.length) {
      html = '<div class="empty"><div class="empty-title">No matching variables</div>'
        + '<p>No variable name contains “' + esc(varFilter) + '”. Clear the filter to see all '
        + REPORT.variables.length + ' variables.</p></div>';
    }
    variablesBody.innerHTML = html;

    variablesBody.querySelectorAll('tr[data-var]').forEach(tr => {
      const open = () => { markRowSelected(tr); showVarDetail(tr.dataset.var); };
      tr.addEventListener('click', open);
      tr.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); }
      });
    });
    variablesBody.querySelectorAll('.sort-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const key = btn.dataset.sort;
        if (varSort.key === key) varSort.dir *= -1;
        else { varSort.key = key; varSort.dir = 1; }
        renderVariables();
      });
    });
  }
  document.getElementById('var-filter').addEventListener('input', e => {
    varFilter = e.target.value.toLowerCase().trim();
    renderVariables();
  });

  /* ==========================================================
     Files view
     ========================================================== */
  const filemapBody = document.getElementById('filemap-body');
  const SEV_ICON = { info: 'ⓘ', warning: '⚠', error: '✖' };
  const SEV_LABEL = { info: 'Info', warning: 'Warning', error: 'Error' };
  const STATUS_CHIP = {
    ok: '<span class="chip chip-ok">✓ ok</span>',
    error: '<span class="chip chip-error">✖ error</span>',
    unresolved: '<span class="chip chip-warn">? unresolved</span>'
  };

  function diagHtml(d) {
    let inner = '<span class="diag-sev">' + SEV_ICON[d.severity] + ' ' + SEV_LABEL[d.severity] + '</span>'
      + '<span class="diag-msg">' + esc(d.message);
    if (d.source) inner += locHtml(d.source);
    if (d.related_node && nodeMap[d.related_node]) {
      inner += ' <a class="node-link" role="link" tabindex="0" data-id="' + esc(d.related_node) + '">'
        + esc(d.related_node) + '</a>';
    }
    inner += '</span>';
    return '<div class="diag-item ' + d.severity + '">' + inner + '</div>';
  }

  function renderFileMap() {
    document.getElementById('filemap-note').textContent = REPORT.files.length
      ? REPORT.files.length + ' file' + (REPORT.files.length === 1 ? '' : 's') + ' parsed'
      : '';

    let html = '';
    if (!REPORT.files.length) {
      html += '<div class="empty"><div class="empty-title">No files parsed</div>'
        + '<p>The parser found no pipeline files at this root.</p></div>';
    } else {
      // Build a directory tree; external references ("[project:…]") stay leaves.
      const tree = { dirs: {}, files: [] };
      REPORT.files.forEach(f => {
        const isExternal = f.path.startsWith('[');
        const parts = isExternal ? [f.path] : f.path.split('/');
        let cur = tree;
        for (let i = 0; i < parts.length - 1; i++) {
          cur = cur.dirs[parts[i]] = cur.dirs[parts[i]] || { dirs: {}, files: [] };
        }
        cur.files.push({ file: f, name: parts[parts.length - 1] });
      });

      const relsFor = path => {
        const inc = fileEdges.filter(e => e.src === path && e.kind === 'includes').map(e => e.dst);
        const invBy = fileEdges.filter(e => e.dst === path && e.kind === 'invokes').map(e => e.src);
        const incBy = fileEdges.filter(e => e.dst === path && e.kind === 'includes').map(e => e.src);
        const bits = [];
        if (inc.length) bits.push('includes ' + inc.map(p => midTruncPath(p, 28)).join(', '));
        if (incBy.length) bits.push('included by ' + incBy.map(p => midTruncPath(p, 28)).join(', '));
        if (invBy.length) bits.push('invoked by ' + invBy.join(', '));
        return bits.join(' · ');
      };

      const renderLevel = (level) => {
        let out = '<ul>';
        Object.keys(level.dirs).sort().forEach(dir => {
          out += '<li><details class="tree-dir" open><summary>' + esc(dir) + '/</summary>'
            + renderLevel(level.dirs[dir]) + '</details></li>';
        });
        level.files.sort((a, b) => a.name.localeCompare(b.name)).forEach(({ file, name }) => {
          const diags = REPORT.diagnostics.filter(d => d.source && d.source.file === file.path);
          const rels = relsFor(file.path);
          out += '<li><div class="file-row" data-path="' + esc(file.path) + '">'
            + '<span class="file-name clip" title="' + esc(file.path) + '">' + esc(name) + '</span>'
            + STATUS_CHIP[file.status]
            + '<span class="chip">' + esc(file.kind === 'gitlab_yaml' ? 'GitLab CI' : file.kind) + '</span>'
            + (rels ? '<span class="file-rels clip" title="' + esc(rels) + '">' + esc(rels) + '</span>' : '')
            + '</div>'
            + (diags.length ? '<div class="file-diags">' + diags.map(diagHtml).join('') + '</div>' : '')
            + '</li>';
        });
        return out + '</ul>';
      };
      html += '<div class="file-tree">' + renderLevel(tree) + '</div>';
    }

    html += '<h3 class="section-heading" id="diag-flat-list">Diagnostics</h3>';
    if (REPORT.diagnostics.length) {
      html += REPORT.diagnostics.map(diagHtml).join('');
    } else {
      html += '<div class="empty empty-good" style="margin-top:var(--sp-3);text-align:left;max-width:860px">'
        + '<div class="empty-title">✓ No diagnostics</div>'
        + '<p>Every include resolved and every file parsed cleanly.</p></div>';
    }
    filemapBody.innerHTML = html;

    filemapBody.querySelectorAll('.node-link').forEach(el => {
      const go = () => showNodeDetail(el.dataset.id);
      el.addEventListener('click', go);
      el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
    });
    wireLocLinks(filemapBody);
  }
  document.getElementById('tree-expand-all').addEventListener('click', () =>
    filemapBody.querySelectorAll('details').forEach(d => { d.open = true; }));
  document.getElementById('tree-collapse-all').addEventListener('click', () =>
    filemapBody.querySelectorAll('details').forEach(d => { d.open = false; }));

  /* ==========================================================
     What-If view: a scratch starting state on the left (event, ref,
     MR knobs, changed files, variables), the resulting candidate
     pipelines on the right — one bounded graph per pipeline, with
     duplicates highlighted across sections. Evaluation is done by
     PipeviewWhatIf (inlined, DOM-free, tested under node).
     ========================================================== */
  const wiControls = document.getElementById('whatif-controls');
  const wiResults = document.getElementById('whatif-results');
  const wiNoteEl = document.getElementById('whatif-note');
  const wiShowSkippedEl = document.getElementById('wi-show-skipped');

  const wiState = {
    scenario: 'push_branch',
    branchKind: 'feature',            // 'main' | 'dev' | 'feature'
    featureName: 'feature/widget',
    tag: 'v1.0.0',
    tagProtected: false,
    openMR: true,
    target: 'main',
    draft: false,
    mrFlavor: 'detached',
    commitMessage: '',
    changedMode: 'unknown',           // 'unknown' | 'all' | 'none' | 'list'
    changedList: '',
    overrides: []                     // [{name, value}]
  };

  const WI_SCENARIOS = [
    ['push_branch', 'Push to a branch'],
    ['push_tag', 'Push a new tag'],
    ['mr', 'MR created / “Run pipeline” on MR'],
    ['schedule', 'Scheduled run'],
    ['web', 'Manual run (web UI)'],
    ['api', 'API pipeline'],
    ['trigger', 'Trigger token']
  ];
  const WI_STATE_LABEL = {
    runs: 'runs', manual: 'manual gate', delayed: 'delayed',
    skipped: 'when: never', 'not-added': 'not added', conditional: 'depends'
  };
  const WI_STATE_CHIP = {
    runs: 'chip-ok', manual: 'chip-warn', delayed: 'chip-warn',
    skipped: 'chip-error', 'not-added': '', conditional: 'chip-info'
  };
  const wiMightRun = s =>
    s === 'runs' || s === 'manual' || s === 'delayed' || s === 'conditional';

  let wiDupSet = new Set();
  let wiLastResult = null;
  let wiRenderTimer = null;

  function wiBranchName() {
    if (wiState.scenario === 'mr') return wiState.featureName || 'feature/widget';
    if (wiState.branchKind === 'feature') return wiState.featureName || 'feature/widget';
    return wiState.branchKind;
  }

  function wiConfig() {
    const overrides = {};
    wiState.overrides.forEach(o => { if (o.name) overrides[o.name] = o.value; });
    let changedFiles = null;
    if (wiState.changedMode === 'all') changedFiles = 'all';
    else if (wiState.changedMode === 'none') changedFiles = [];
    else if (wiState.changedMode === 'list') {
      changedFiles = wiState.changedList.split('\n').map(s => s.trim()).filter(Boolean);
    }
    return {
      scenario: wiState.scenario,
      branch: wiBranchName(),
      tag: wiState.tag || 'v1.0.0',
      tagProtected: wiState.tagProtected,
      openMR: wiState.scenario === 'push_branch' ? wiState.openMR : wiState.scenario === 'mr',
      target: wiState.target,
      draft: wiState.draft,
      mrFlavor: wiState.mrFlavor,
      commitMessage: wiState.commitMessage,
      changedFiles: changedFiles,
      overrides: overrides
    };
  }

  /* ---------------- controls ---------------- */

  function wiRadio(name, value, label, checked, chip) {
    return '<label class="wi-choice"><input type="radio" name="' + name + '" value="'
