<html lang="en">
<head>

<style>
/* ============================================================
   Design tokens. Every color, size, and space in this file
   derives from these. Light is the base; dark overrides the
   same names via data-theme or prefers-color-scheme.
   ============================================================ */
:root {
  /* type */
  --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
  --fs-0: 11px;  /* chips, overlines, fine print */
  --fs-1: 12px;  /* dense data, meta, code */
  --fs-2: 13px;  /* body */
  --fs-3: 15px;  /* section headings */
  --fs-4: 18px;  /* view titles */
  /* space (4px base) */
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 24px; --sp-6: 32px;
  /* detail */
  --radius: 6px;
  --radius-sm: calc(var(--radius) - 2px);
  --shadow: 0 2px 10px rgba(15, 20, 30, 0.14);
  --hit: 32px; /* minimum control hit target */

  /* color — light */
  --surface: #f4f5f7;
  --surface-raised: #ffffff;
  --surface-sunken: #eceef2;
  --border: #d8dce3;
  --border-strong: #aeb6c2;
  --text: #1a2029;
  --text-muted: #5a6371;
  --accent: #3b5bdb;
  --accent-strong: #2f4bc0;
  --accent-tint: #e9eefc;
  --accent-contrast: #ffffff;
  --ok: #26703a;      --ok-bg: #e2f2e7;
  --info: #1868b3;    --info-bg: #e3effa;
  --warn: #8a5300;    --warn-bg: #faf0da;
  --error: #b32626;   --error-bg: #fbe7e7;
  --scrim: rgba(20, 24, 32, 0.35);
  /* edge kinds (second channel is always the dash pattern) */
  --edge-prerequisite: #5a6371;
  --edge-order-only: #a05a00;
  --edge-needs: #3b5bdb;
  --edge-stage-order: #8f3fa8;
  --edge-includes: #0f7b6c;
  --edge-invokes: #bb2f63;
  --edge-extends: #6741d9;
}
[data-theme="dark"] { color-scheme: dark; }
:root[data-theme="dark"] {
  --surface: #15181d;
  --surface-raised: #1d2127;
  --surface-sunken: #101317;
  --border: #2e343d;
  --border-strong: #4c5563;
  --text: #e5e9ef;
  --text-muted: #9aa4b1;
  --accent: #8da2f2;
  --accent-strong: #a9b8f5;
  --accent-tint: #262e45;
  --accent-contrast: #10131f;
  --ok: #85d197;      --ok-bg: #1a2b1f;
  --info: #82bdf2;    --info-bg: #1a2733;
  --warn: #e3b566;    --warn-bg: #2e2617;
  --error: #f09090;   --error-bg: #331c1c;
  --scrim: rgba(0, 0, 0, 0.5);
  --shadow: 0 2px 12px rgba(0, 0, 0, 0.45);
  --edge-prerequisite: #98a2b0;
  --edge-order-only: #d99a4e;
  --edge-needs: #8da2f2;
  --edge-stage-order: #d08fe0;
  --edge-includes: #55c0ae;
  --edge-invokes: #ef82a9;
  --edge-extends: #ab97ec;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --surface: #15181d;
    --surface-raised: #1d2127;
    --surface-sunken: #101317;
    --border: #2e343d;
    --border-strong: #4c5563;
    --text: #e5e9ef;
    --text-muted: #9aa4b1;
    --accent: #8da2f2;
    --accent-strong: #a9b8f5;
    --accent-tint: #262e45;
    --accent-contrast: #10131f;
    --ok: #85d197;      --ok-bg: #1a2b1f;
    --info: #82bdf2;    --info-bg: #1a2733;
    --warn: #e3b566;    --warn-bg: #2e2617;
    --error: #f09090;   --error-bg: #331c1c;
    --scrim: rgba(0, 0, 0, 0.5);
    --shadow: 0 2px 12px rgba(0, 0, 0, 0.45);
    --edge-prerequisite: #98a2b0;
    --edge-order-only: #d99a4e;
    --edge-needs: #8da2f2;
    --edge-stage-order: #d08fe0;
    --edge-includes: #55c0ae;
    --edge-invokes: #ef82a9;
    --edge-extends: #ab97ec;
  }
}

/* ============================================================
   Base
   ============================================================ */
* { margin: 0; padding: 0; box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  font-family: var(--font-ui);
  font-size: var(--fs-2);
  line-height: 1.45;
  background: var(--surface);
  color: var(--text);
  display: flex;
  flex-direction: column;
  /* Desktop tool: below this, horizontal page scroll is intended. */
  min-width: 960px;
  overflow: auto;
}
a { color: var(--accent); text-decoration: none; cursor: pointer; }
a:hover { text-decoration: underline; }
code { font-family: var(--font-mono); font-size: var(--fs-1); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-radius: 2px; }
::selection { background: var(--accent-tint); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    transition: none !important;
    animation: none !important;
    scroll-behavior: auto !important;
  }
}

/* ============================================================
   Overflow policy (applies everywhere):
   - .clip      single-line contexts: ellipsis + full value in title/panel
   - .wrap-any  prose that may contain long tokens: break anywhere
   - pre/.codeblock  code: preserved whitespace, horizontal scroll
                     inside the block, optional soft-wrap toggle
   - paths are middle-truncated in JS (tail preserved)
   ============================================================ */
.clip { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.wrap-any { overflow-wrap: anywhere; }
.codeblock {
  background: var(--surface-sunken);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: var(--sp-2) var(--sp-3);
  font-family: var(--font-mono);
  font-size: var(--fs-1);
  line-height: 1.6;
  white-space: pre;
  overflow-x: auto;
  max-width: 100%;
}
.codeblock.soft-wrap { white-space: pre-wrap; overflow-wrap: anywhere; }
.codeblock .var-ref { color: var(--accent); cursor: pointer; }
.codeblock .var-ref:hover { text-decoration: underline; }
/* hover-explained code glyphs: dotted underline signals "there's a meaning here" */
.codeblock .auto-var,
.codeblock .recipe-prefix {
  text-decoration: underline dotted var(--text-muted);
  text-underline-offset: 2px;
  cursor: help;
}

/* ============================================================
   Shared components
   ============================================================ */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: var(--hit); min-width: var(--hit);
  padding: 0 var(--sp-3);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface-raised);
  color: var(--text);
  font: 500 var(--fs-1) var(--font-ui);
  cursor: pointer;
  white-space: nowrap;
}
.btn:hover { border-color: var(--border-strong); background: var(--surface-sunken); }
.btn:active { background: var(--surface-sunken); }
.btn.copied { color: var(--ok); border-color: var(--ok); }
.btn-quiet { border-color: transparent; background: transparent; color: var(--text-muted); }
.btn-quiet:hover { background: var(--surface-sunken); color: var(--text); border-color: transparent; }

.chip {
  display: inline-block;
  padding: 1px 7px;
  border-radius: var(--radius-sm);
  font-size: var(--fs-0);
  font-weight: 500;
  line-height: 1.5;
  background: var(--surface-sunken);
  border: 1px solid var(--border);
  color: var(--text-muted);
  white-space: nowrap;
  vertical-align: middle;
}
.chip-accent { background: var(--accent-tint); border-color: transparent; color: var(--accent); }
.chip-ok     { background: var(--ok-bg);     border-color: transparent; color: var(--ok); }
.chip-info   { background: var(--info-bg);   border-color: transparent; color: var(--info); }
.chip-warn   { background: var(--warn-bg);   border-color: transparent; color: var(--warn); }
.chip-error  { background: var(--error-bg);  border-color: transparent; color: var(--error); }
.chip-ghost  { border-style: dashed; }

.input {
  min-height: var(--hit);
  padding: 0 var(--sp-3);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface-raised);
  color: var(--text);
  font: 400 var(--fs-2) var(--font-ui);
}
.input::placeholder { color: var(--text-muted); }
.input:focus { border-color: var(--accent); outline: none; }

/* file:line locations — one component everywhere */
.loc {
  font-family: var(--font-mono);
  font-size: var(--fs-0);
  color: var(--text-muted);
  white-space: nowrap;
}
a.loc:hover, .loc.loc-link:hover { color: var(--accent); text-decoration: underline; cursor: pointer; }

/* tooltips ([data-tip]): shown on hover AND focus. One shared element,
   position:fixed and placed by the tooltip engine in the script, which
   clamps it to the viewport — a per-anchor ::after can neither avoid
   running off a window edge nor escape an overflow-clipping ancestor,
   and it collides with anchors that use ::after themselves (splitter) */
.tooltip {
  position: fixed;
  top: 0;
  left: 0;
  background: var(--text);
  color: var(--surface);
  font: 400 var(--fs-0) var(--font-ui);
  padding: 3px 8px;
  border-radius: var(--radius-sm);
  /* short tips stay one line; sentence-length tips wrap instead of
     escaping the viewport (overflow policy) */
  white-space: normal;
  width: max-content;
  max-width: 280px;
  z-index: 200;
  pointer-events: none;
}
.tooltip[hidden] { display: none; }

/* predefined-variable docs: dotted underline marks "hover for what this is" */
.pre-doc {
  text-decoration: underline dotted var(--text-muted);
  text-underline-offset: 2px;
  cursor: help;
  min-width: 0;
}
/* names that may ellipsize keep the .clip one level in, so the doc tip
   (and its underline) stays on the wrapper */
.pre-doc .clip { display: block; }

/* predefined-variables reference (Variables tab, GitLab reports) */
.pre-ref { margin-top: var(--sp-5); }
.pre-ref summary {
  cursor: pointer;
  font-weight: 600;
  padding: var(--sp-2) 0;
  color: var(--text-muted);
}
.pre-ref[open] summary { color: var(--text); }
.pre-ref .input { margin: var(--sp-2) 0; max-width: 320px; }
.pre-ref-entry { padding: var(--sp-2) 0; border-bottom: 1px solid var(--border); }
.pre-ref-head { display: flex; align-items: center; gap: var(--sp-2); }
.pre-ref-head .btn { min-height: 22px; padding: 0 var(--sp-2); font-size: var(--fs-0); }
.pre-ref-eg { color: var(--text-muted); }

/* designed empty states */
.empty {
  margin: var(--sp-6) auto;
  max-width: 420px;
  text-align: center;
  color: var(--text-muted);
}
.empty .empty-title { font-size: var(--fs-3); font-weight: 600; color: var(--text); margin-bottom: var(--sp-2); }
.empty.empty-good .empty-title { color: var(--ok); }
.empty p { font-size: var(--fs-2); }

mark {
  background: var(--accent-tint);
  color: var(--accent-strong);
  font-weight: 600;
  border-radius: 2px;
  padding: 0 1px;
}

@keyframes flash-row { 0% { background: var(--accent-tint); } 100% { background: transparent; } }
.flash { animation: flash-row 1.6s ease-out 1; }

/* ============================================================
   App chrome: header, tabs
   ============================================================ */
.app-header {
  display: flex; align-items: center; gap: var(--sp-3);
  padding: var(--sp-2) var(--sp-4);
  background: var(--surface-raised);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  min-height: 48px;
}
.brand { font-size: var(--fs-3); font-weight: 650; letter-spacing: -0.01em; white-space: nowrap; }
.brand .brand-pipe { color: var(--accent); }
.header-meta {
  display: flex; align-items: center; gap: var(--sp-2);
  min-width: 0; color: var(--text-muted); font-size: var(--fs-1);
}
.header-meta .root-path { font-family: var(--font-mono); color: var(--text); }
.header-actions { margin-left: auto; display: flex; align-items: center; gap: var(--sp-2); flex-shrink: 0; }
.diag-badge { border: none; }
.diag-badge:hover { filter: brightness(0.96); }

.tabs {
  display: flex; gap: var(--sp-1);
  padding: 0 var(--sp-3);
  background: var(--surface-raised);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.tab {
  appearance: none; border: none; background: none;
  padding: var(--sp-2) var(--sp-4);
  min-height: 40px;
  font: 500 var(--fs-2) var(--font-ui);
  color: var(--text-muted);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  transition: color 0.12s;
}
.tab:hover { color: var(--text); }
.tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
.tab .tab-count { color: var(--text-muted); font-weight: 400; font-size: var(--fs-0); margin-left: 4px; }

/* ============================================================
   Main layout: content | splitter | detail panel
   ============================================================ */
.main { display: flex; flex: 1; min-height: 0; }
.content { flex: 1; min-width: 320px; display: flex; flex-direction: column; position: relative; }

.view { display: none; flex: 1; min-height: 0; flex-direction: column; }
.view.active { display: flex; }
.view-toolbar {
  display: flex; align-items: center; gap: var(--sp-3);
  padding: var(--sp-2) var(--sp-4);
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  flex-shrink: 0;
  min-height: 48px;
}
.view-toolbar .toolbar-title { font-size: var(--fs-2); font-weight: 600; }
.view-toolbar .toolbar-note { color: var(--text-muted); font-size: var(--fs-1); }
.view-toolbar .toolbar-spacer { margin-left: auto; }
.view-body {
  flex: 1; min-height: 0;
  overflow: auto;
  scrollbar-gutter: stable;
  padding: var(--sp-4);
}
.view-body.no-pad { padding: 0; overflow: hidden; }

/* splitter */
.splitter {
  width: 6px; flex-shrink: 0;
  cursor: col-resize;
  background: var(--surface);
  border-left: 1px solid var(--border);
  position: relative;
}
.splitter::after {
  content: '';
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 2px; height: 40px;
  border-radius: 2px;
  background: var(--border-strong);
}
.splitter:hover, .splitter.dragging, .splitter:focus-visible { background: var(--accent-tint); }
.splitter:hover::after, .splitter.dragging::after { background: var(--accent); }

/* detail panel */
.panel {
  width: 400px;
  min-width: 300px;
  background: var(--surface-raised);
  display: flex; flex-direction: column;
  flex-shrink: 0;
  min-height: 0;
}
.main.panel-closed .panel, .main.panel-closed .splitter { display: none; }
.panel-header {
  display: flex; align-items: flex-start; gap: var(--sp-2);
  padding: var(--sp-3) var(--sp-4);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.panel-header .panel-name {
  font: 600 var(--fs-3) var(--font-mono);
  overflow-wrap: anywhere;
  min-width: 0; flex: 1;
}
.panel-body { flex: 1; overflow-y: auto; padding: var(--sp-3) var(--sp-4) var(--sp-5); min-height: 0; }
.panel-section { margin-bottom: var(--sp-4); }
.panel-section > h3 {
  font-size: var(--fs-0);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-muted);
  margin-bottom: var(--sp-2);
  display: flex; align-items: center; gap: var(--sp-2);
}
.panel-section > h3 .section-action { margin-left: auto; text-transform: none; letter-spacing: 0; }
.panel-section .value { font-size: var(--fs-2); }
.panel-idrow { display: flex; flex-wrap: wrap; gap: var(--sp-1); align-items: center; margin-bottom: var(--sp-1); }
.edge-list { list-style: none; }
.edge-list li {
  display: flex; align-items: center; gap: var(--sp-2);
  padding: 3px 0;
  min-width: 0;
}
.edge-list .edge-target { font-family: var(--font-mono); font-size: var(--fs-1); flex-shrink: 1; }
.kv-list { display: grid; grid-template-columns: auto 1fr; gap: var(--sp-1) var(--sp-3); font-size: var(--fs-1); }
.kv-list dt { color: var(--text-muted); white-space: nowrap; }
.kv-list dd { overflow-wrap: anywhere; font-family: var(--font-mono); }

/* ============================================================
   Graph view
   ============================================================ */
.graph-container { width: 100%; height: 100%; position: relative; overflow: hidden; background: var(--surface); }
.graph-container:active { cursor: grabbing; }
.graph-svg { width: 100%; height: 100%; display: block; }
.graph-node { cursor: pointer; }
.graph-node rect {
  fill: var(--surface-raised);
  stroke: var(--border-strong);
  stroke-width: 1.25;
  transition: stroke 0.1s;
}
.graph-node text {
  fill: var(--text);
  font-family: var(--font-mono);
  font-size: 11.5px;
  pointer-events: none;
}
.graph-node.is-task text { font-weight: 600; }
.graph-node.kind-stage rect { fill: var(--accent-tint); stroke: var(--accent); }
.graph-node.kind-ghost rect { fill: var(--surface-sunken); stroke: var(--text-muted); stroke-dasharray: 5 3; }
.graph-node.kind-ghost text { fill: var(--text-muted); }
.graph-node.kind-pattern_rule rect { stroke-dasharray: 1.5 2.5; }
.graph-node:hover rect { stroke: var(--accent); }
.graph-node.selected rect { stroke: var(--accent); stroke-width: 2.5; }
.graph-node.dimmed, .graph-edge.dimmed { opacity: 0.18; }
.graph-edge { fill: none; stroke-width: 1.5; }

.graph-controls {
  position: absolute; top: var(--sp-3); right: var(--sp-3);
  display: flex; flex-direction: column; gap: var(--sp-1);
  z-index: 10;
}
.graph-controls .btn { box-shadow: var(--shadow); font-size: var(--fs-3); padding: 0; }
.zoom-level {
  text-align: center;
  font: 500 var(--fs-0) var(--font-mono);
  color: var(--text-muted);
  background: var(--surface-raised);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 3px 0;
  box-shadow: var(--shadow);
}

.graph-legend {
  position: absolute; bottom: var(--sp-3); left: var(--sp-3);
  z-index: 10;
  background: var(--surface-raised);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  font-size: var(--fs-1);
  max-width: 260px;
}
.graph-legend summary {
  cursor: pointer;
  padding: var(--sp-2) var(--sp-3);
  font-weight: 600;
  min-height: var(--hit);
  display: flex; align-items: center;
  user-select: none;
  list-style-position: inside;
}
.graph-legend .legend-body { padding: 0 var(--sp-3) var(--sp-3); }
.legend-item { display: flex; align-items: center; gap: var(--sp-2); min-height: 28px; cursor: pointer; }
.legend-item input { accent-color: var(--accent); width: 14px; height: 14px; flex-shrink: 0; }
.legend-item svg { flex-shrink: 0; }
.legend-note { color: var(--text-muted); margin-top: var(--sp-2); font-size: var(--fs-0); }
.legend-note .sample-ghost {
  display: inline-block; width: 20px; height: 10px;
  border: 1.5px dashed var(--text-muted); border-radius: 3px;
  vertical-align: -1px; margin-right: 4px;
}
.legend-section {
  font-size: var(--fs-0); font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.05em;
  color: var(--text-muted);
  margin: var(--sp-3) 0 2px;
}
.legend-body > .legend-section:first-child { margin-top: var(--sp-1); }
.legend-item .legend-count { color: var(--text-muted); margin-left: auto; }
.focus-row { display: flex; align-items: center; gap: var(--sp-2); min-height: 28px; }
.focus-row label { color: var(--text-muted); }
.focus-row select, .focus-row input {
  min-height: 24px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface-raised);
  color: var(--text);
  font: 400 var(--fs-1) var(--font-ui);
  padding: 0 var(--sp-1);
}
.focus-row input { width: 52px; }

/* collapsed namespace groups + expanded cluster outlines */
.graph-node.kind-group rect { fill: var(--surface-sunken); stroke: var(--border-strong); stroke-width: 1.5; }
.graph-node.kind-group text { font-weight: 600; }
.graph-cluster rect {
  fill: none;
  stroke: var(--border-strong);
  stroke-dasharray: 3 3;
  stroke-width: 1;
}
.graph-cluster .cluster-label {
  fill: var(--text-muted);
  font: 600 10.5px var(--font-ui);
  cursor: pointer;
}
.graph-cluster .cluster-label:hover { fill: var(--accent); }

/* ============================================================
   Data tables (tasks, variables)
   ============================================================ */
.data-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
.data-table th {
  position: sticky; top: calc(-1 * var(--sp-4));
  background: var(--surface);
  text-align: left;
  font-size: var(--fs-0);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-muted);
  border-bottom: 2px solid var(--border);
  padding: var(--sp-2);
  z-index: 5;
  white-space: nowrap;
}
.data-table th.num, .data-table td.num { text-align: right; font-variant-numeric: tabular-nums; }
.data-table th button.sort-btn {
  appearance: none; background: none; border: none;
  font: inherit; color: inherit; letter-spacing: inherit; text-transform: inherit;
  cursor: pointer; padding: var(--sp-2); margin: calc(-1 * var(--sp-2));
  min-height: var(--hit);
}
.data-table th button.sort-btn:hover { color: var(--text); }
.data-table th .sort-arrow { font-size: 9px; margin-left: 3px; }
.data-table td {
  padding: var(--sp-2);
  border-bottom: 1px solid var(--border);
  font-size: var(--fs-2);
  vertical-align: middle;
}
.data-table tbody tr[tabindex] { cursor: pointer; }
.data-table tbody tr:hover td, .data-table tbody tr.row-selected td { background: var(--accent-tint); }
.data-table .cell-name { font-family: var(--font-mono); font-weight: 600; }
.data-table .cell-doc { color: var(--text); }
.data-table .cell-doc.no-doc { color: var(--text-muted); font-style: italic; }
.data-table .cell-value { font-family: var(--font-mono); font-size: var(--fs-1); }
.invocation {
  font-family: var(--font-mono); font-size: var(--fs-1);
  background: var(--surface-sunken);
  border: 1px solid var(--border);
  padding: 2px 8px; border-radius: var(--radius-sm);
}
td .btn.copy-btn { min-height: var(--hit); }

/* ============================================================
   Variable event timeline — the report's signature element.
   A vertical rail; each assignment event is a station with an
   operator badge, scope, location, and override diffs in place.
   ============================================================ */
.timeline { list-style: none; position: relative; padding-left: var(--sp-4); }
.timeline::before {
  content: '';
  position: absolute; left: 5px; top: 8px; bottom: 8px;
  width: 2px; border-radius: 1px;
  background: var(--border);
}
.tl-event { position: relative; padding: var(--sp-2) 0 var(--sp-2) var(--sp-1); }
.tl-event::before {
  content: '';
  position: absolute; left: calc(-1 * var(--sp-4) + 1px); top: 15px;
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--surface-raised);
  border: 2px solid var(--accent);
}
.tl-event.tl-final::before { background: var(--accent); }
.tl-head { display: flex; align-items: baseline; gap: var(--sp-2); flex-wrap: wrap; margin-bottom: var(--sp-1); }
.op-badge {
  font: 600 var(--fs-0) var(--font-mono);
  color: var(--accent);
  background: var(--accent-tint);
  border-radius: var(--radius-sm);
  padding: 1px 6px;
  min-width: 24px;
  text-align: center;
}
.tl-scope { font-size: var(--fs-0); color: var(--text-muted); }
.tl-head .loc { margin-left: auto; }
.tl-value { font-family: var(--font-mono); font-size: var(--fs-1); overflow-wrap: anywhere; }
.tl-note { margin-top: 2px; font-size: var(--fs-0); color: var(--text-muted); overflow-wrap: anywhere; }
.tl-diff { margin-top: 2px; font-family: var(--font-mono); font-size: var(--fs-1); }
.tl-diff del {
  background: var(--error-bg); color: var(--error);
  text-decoration: line-through; border-radius: 2px; padding: 0 3px;
  overflow-wrap: anywhere;
}
.tl-diff ins {
  background: var(--ok-bg); color: var(--ok);
  text-decoration: none; border-radius: 2px; padding: 0 3px;
  overflow-wrap: anywhere;
}
.tl-arrow { color: var(--text-muted); padding: 0 2px; }

/* ============================================================
   File map & diagnostics
   ============================================================ */
.file-tree { list-style: none; font-size: var(--fs-2); max-width: 860px; }
.file-tree ul { list-style: none; padding-left: var(--sp-5); }
.tree-dir > summary {
  cursor: pointer;
  padding: var(--sp-1) var(--sp-2);
  border-radius: var(--radius-sm);
  font-weight: 600;
  min-height: 30px;
  display: flex; align-items: center; gap: var(--sp-2);
  user-select: none;
}
.tree-dir > summary::before {
  content: '▸';
  color: var(--text-muted);
  transition: transform 0.12s;
}
.tree-dir[open] > summary::before { transform: rotate(90deg); }
.tree-dir > summary:hover { background: var(--surface-sunken); }
.file-row {
  display: flex; align-items: center; gap: var(--sp-2);
  padding: var(--sp-1) var(--sp-2);
  border-radius: var(--radius-sm);
  min-height: 30px;
  min-width: 0;
}
.file-row:hover { background: var(--surface-sunken); }
.file-row .file-name { font-family: var(--font-mono); font-size: var(--fs-1); }
.file-row .file-rels { color: var(--text-muted); font-size: var(--fs-0); margin-left: var(--sp-2); }
.file-diags { padding-left: var(--sp-5); }

.diag-item {
  display: flex; gap: var(--sp-2); align-items: flex-start;
  padding: var(--sp-2) var(--sp-3);
  margin: var(--sp-1) 0;
  border-radius: var(--radius-sm);
  font-size: var(--fs-1);
  max-width: 860px;
}
/* Report-level banner: same visual language as an info diagnostic. */
.report-banner {
  background: var(--info-bg);
  color: var(--text);
  border-bottom: 1px solid var(--border);
  padding: var(--sp-2) var(--sp-4);
  font-size: var(--fs-1);
}
.report-banner .diag-sev { color: var(--info); font-weight: 700; margin-right: var(--sp-2); }
.report-banner code { background: transparent; }
.diag-item.info    { background: var(--info-bg); }
.diag-item.warning { background: var(--warn-bg); }
.diag-item.error   { background: var(--error-bg); }
.diag-sev { font-weight: 700; white-space: nowrap; flex-shrink: 0; }
.diag-item.info .diag-sev { color: var(--info); }
.diag-item.warning .diag-sev { color: var(--warn); }
.diag-item.error .diag-sev { color: var(--error); }
.diag-msg { overflow-wrap: anywhere; min-width: 0; }
.diag-msg .loc { margin-left: var(--sp-2); }
.section-heading { font-size: var(--fs-3); font-weight: 600; margin: var(--sp-5) 0 var(--sp-2); }
.section-heading:first-child { margin-top: 0; }

/* ============================================================
   What-If view: scratchpad controls | sectioned pipeline graphs
   ============================================================ */
.whatif-layout { display: flex; height: 100%; min-height: 0; }
.whatif-controls {
  width: 310px; flex-shrink: 0;
  overflow-y: auto;
  border-right: 1px solid var(--border);
  background: var(--surface-raised);
  padding: var(--sp-3) var(--sp-4) var(--sp-6);
}
.whatif-results { flex: 1; min-width: 0; overflow: auto; padding: var(--sp-4); }

.wi-group { margin-bottom: var(--sp-4); }
.wi-group > h3 {
  font-size: var(--fs-0); font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.06em;
  color: var(--text-muted);
  margin-bottom: var(--sp-2);
}
.wi-choice {
  display: flex; align-items: center; gap: var(--sp-2);
  min-height: 26px; cursor: pointer; font-size: var(--fs-2);
}
.wi-choice input { accent-color: var(--accent); flex-shrink: 0; }
.wi-choice .chip { margin-left: auto; }
.wi-field { margin: var(--sp-1) 0 var(--sp-2); }
.wi-field > label { display: block; font-size: var(--fs-0); color: var(--text-muted); margin-bottom: 2px; }
.wi-field .input, .wi-field select.input { width: 100%; min-height: 28px; font-size: var(--fs-1); }
.wi-field textarea.input { min-height: 64px; padding: var(--sp-1) var(--sp-2); font-family: var(--font-mono); resize: vertical; }
.wi-inline-btns { display: flex; gap: var(--sp-1); margin-top: var(--sp-1); }
.wi-inline-btns .btn { min-height: 24px; font-size: var(--fs-0); padding: 0 var(--sp-2); }
.wi-var-row { display: flex; gap: var(--sp-1); margin-bottom: var(--sp-1); align-items: center; }
.wi-var-row .input { min-height: 26px; font-size: var(--fs-0); font-family: var(--font-mono); }
.wi-var-row .wi-var-name { width: 45%; }
.wi-var-row .wi-var-value { flex: 1; min-width: 0; }
.wi-var-row .btn { min-height: 26px; min-width: 26px; padding: 0; }
.wi-unknown-var {
  display: flex; align-items: center; gap: var(--sp-2);
  font-family: var(--font-mono); font-size: var(--fs-0);
  min-height: 24px;
}
.wi-unknown-var .btn { margin-left: auto; min-height: 22px; font-size: var(--fs-0); padding: 0 var(--sp-2); }

.wi-banner-strip { margin-bottom: var(--sp-3); }
.wi-banner-strip .diag-item { max-width: none; }

.wi-pipeline {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface-raised);
  margin-bottom: var(--sp-4);
  overflow: hidden;
}
.wi-pipeline.wi-dead { background: var(--surface-sunken); }
.wi-pipe-head {
  display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap;
  padding: var(--sp-2) var(--sp-3);
  border-bottom: 1px solid var(--border);
}
.wi-pipeline.wi-dead .wi-pipe-head { border-bottom: none; }
.wi-pipe-title { font-weight: 600; font-size: var(--fs-2); }
.wi-pipe-reason { color: var(--text-muted); font-size: var(--fs-1); padding: var(--sp-2) var(--sp-3); }
.wi-pipe-banners { padding: var(--sp-1) var(--sp-2) 0; }
.wi-pipe-banners .diag-item { max-width: none; margin: var(--sp-1) 0; }
.wi-graph { overflow-x: auto; padding: var(--sp-2); }
.wi-graph svg { display: block; }
.wi-children { padding: 0 var(--sp-3) var(--sp-3) var(--sp-5); }
.wi-children .wi-pipeline { border-left: 3px solid var(--edge-invokes); margin-bottom: var(--sp-3); }

/* node states in the mini graphs */
.wi-node { cursor: pointer; }
.wi-node rect { fill: var(--surface-raised); stroke: var(--border-strong); stroke-width: 1.5; }
.wi-node text { fill: var(--text); font-family: var(--font-mono); font-size: 11px; pointer-events: none; }
.wi-node .wi-state-label { fill: var(--text-muted); font-size: 9px; font-family: var(--font-ui); }
.wi-node.st-runs rect { stroke: var(--ok); }
.wi-node.st-manual rect { stroke: var(--warn); }
.wi-node.st-delayed rect { stroke: var(--warn); stroke-dasharray: 7 3; }
.wi-node.st-conditional rect { stroke: var(--info); stroke-dasharray: 2 3; }
.wi-node.st-skipped, .wi-node.st-not-added { opacity: 0.4; }
.wi-node.st-skipped rect, .wi-node.st-not-added rect { stroke-dasharray: 4 3; }
.wi-node.wi-dup rect { stroke-width: 2.75; }
.wi-node.wi-dup .wi-dup-badge { fill: var(--warn); }
.wi-node.wi-hl rect { stroke: var(--accent); stroke-width: 3; }
/* delta mode: the diff class outranks the state class */
.wi-node.d-added rect { stroke: var(--ok); stroke-width: 2.5; stroke-dasharray: none; }
.wi-node.d-removed { opacity: 0.55; }
.wi-node.d-removed rect { stroke: var(--error); stroke-dasharray: 5 3; }
/* strike the job name only — the "removed · was runs" explainer must stay legible */
.wi-node.d-removed text:not(.wi-state-label) { text-decoration: line-through; }
.wi-node.d-changed rect { stroke: var(--warn); stroke-width: 2.5; stroke-dasharray: none; }
.wi-text { margin-bottom: var(--sp-3); font-size: var(--fs-0); }
.wi-text summary { cursor: pointer; color: var(--text-muted); min-height: 24px; user-select: none; }
.wi-text summary:hover { color: var(--text); }
.wi-text pre {
  margin-top: var(--sp-1); padding: var(--sp-2) var(--sp-3);
  background: var(--surface-sunken); border: 1px solid var(--border);
  border-radius: 6px; overflow-x: auto;
  font-family: var(--font-mono); font-size: var(--fs-0); line-height: 1.5;
  user-select: text; cursor: text;
}
#wi-pin-baseline.wi-pinned { border-color: var(--accent); color: var(--accent); }
.legend-item:has(input:disabled) { opacity: 0.45; cursor: not-allowed; }
.wi-edge { fill: none; stroke: var(--edge-needs); stroke-width: 1.4; }
.wi-edge.kind-stage_order { stroke: var(--edge-stage-order); stroke-dasharray: 4 4; opacity: 0.6; }

.wi-legend { display: flex; flex-wrap: wrap; gap: var(--sp-2); margin-bottom: var(--sp-3); }

/* per-pipeline "variables in effect" disclosure */
.wi-env { margin: var(--sp-1) var(--sp-3) var(--sp-2); font-size: var(--fs-0); }
.wi-env summary { cursor: pointer; color: var(--text-muted); min-height: 24px; user-select: none; }
.wi-env summary:hover { color: var(--text); }
.wi-env table { border-collapse: collapse; width: 100%; margin-top: var(--sp-1); }
.wi-env td {
  padding: 2px 10px 2px 0; vertical-align: top;
  border-bottom: 1px solid var(--border); font-size: var(--fs-0);
}

/* ============================================================
   Search
   ============================================================ */
.search-wrap { position: relative; }
.search-wrap .input { width: 260px; padding-right: 32px; }
.search-shortcut {
  position: absolute;
  right: var(--sp-2);
  top: 50%;
  transform: translateY(-50%);
  pointer-events: none;
}
.search-results {
  position: absolute; top: calc(100% + 4px); right: 0;
  width: 380px; max-height: 420px; overflow-y: auto;
  background: var(--surface-raised);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  z-index: 100;
  display: none;
}
.search-results.open { display: block; }
.sr-group-title {
  font-size: var(--fs-0); font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.05em; color: var(--text-muted);
  padding: var(--sp-2) var(--sp-3) var(--sp-1);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; background: var(--surface-raised);
}
.search-result {
  display: flex; align-items: center; gap: var(--sp-2);
  padding: var(--sp-2) var(--sp-3);
  cursor: pointer;
  min-height: 36px;
  min-width: 0;
}
.search-result:hover, .search-result.active { background: var(--accent-tint); }
.search-result .sr-label { font-family: var(--font-mono); font-size: var(--fs-1); flex: 1; }
.search-result .chip { flex-shrink: 0; }
.sr-empty { padding: var(--sp-4); color: var(--text-muted); text-align: center; font-size: var(--fs-2); }
kbd {
  font: 500 var(--fs-0) var(--font-mono);
  background: var(--surface-sunken);
  border: 1px solid var(--border);
  border-bottom-width: 2px;
  border-radius: var(--radius-sm);
  padding: 0 5px;
}

/* ============================================================
   Print: legible pages, not app chrome
   ============================================================ */
@media print {
  body { min-width: 0; height: auto; overflow: visible; background: #fff; }
  .app-header .header-actions, .tabs, .splitter, .graph-controls,
  .graph-legend, .view-toolbar .btn, .view-toolbar .input, .copy-btn { display: none !important; }
  .main { display: block; }
  .content, .view-body { overflow: visible; height: auto; }
  .view.active { display: block; }
  .panel { width: auto; border-top: 1px solid var(--border); page-break-inside: avoid; }
  .panel-body { overflow: visible; }
  .graph-container { height: 620px; border: 1px solid var(--border); }
  .data-table th { position: static; }
}
</style>

<body>

<header class="app-header">
  <span class="brand">pipe<span class="brand-pipe">view</span></span>
  <div class="header-meta">
    <span class="root-path clip" id="header-root"></span>
    <span class="chip" id="header-format"></span>
    <span id="header-generated"></span>
  </div>
  <div class="header-actions">
    <button class="chip diag-badge" id="diag-badge" hidden></button>
    <button class="btn btn-quiet" id="theme-toggle" data-tip="Switch theme" aria-live="polite"></button>
    <div class="search-wrap">
      <input type="text" class="input" id="global-search" placeholder="Search…"
        autocomplete="off" role="combobox" aria-expanded="false" aria-label="Search tasks, variables, and files">
      <kbd class="search-shortcut" aria-hidden="true">/</kbd>
      <div class="search-results" id="search-results" role="listbox"></div>
    </div>
  </div>
</header>

<nav class="tabs" role="tablist" aria-label="Report views">
  <button class="tab" role="tab" id="tab-graph" aria-controls="view-graph" data-view="graph">Graph<span class="tab-count" id="count-graph"></span></button>
  <button class="tab" role="tab" id="tab-catalog" aria-controls="view-catalog" data-view="catalog">Tasks<span class="tab-count" id="count-catalog"></span></button>
  <button class="tab" role="tab" id="tab-variables" aria-controls="view-variables" data-view="variables">Variables<span class="tab-count" id="count-variables"></span></button>
  <button class="tab" role="tab" id="tab-filemap" aria-controls="view-filemap" data-view="filemap">Files<span class="tab-count" id="count-filemap"></span></button>
  <button class="tab" role="tab" id="tab-whatif" aria-controls="view-whatif" data-view="whatif" hidden>What-If<span class="tab-count" id="count-whatif"></span></button>
</nav>

<!-- Report-level gate (e.g. GitLab workflow:rules): shown on every view so
     "why didn't my pipeline run" is never buried. -->
<div class="report-banner" id="report-banner" hidden></div>

<div class="main panel-closed" id="main">
  <div class="content">

    <section class="view active" id="view-graph" role="tabpanel" aria-labelledby="tab-graph">
      <div class="view-toolbar">
        <span class="toolbar-title">Dependency graph</span>
        <span class="toolbar-note" id="graph-note"></span>
        <span class="toolbar-spacer"></span>
        <span class="toolbar-note">Click a node to focus its dependencies. Drag to pan, scroll to zoom.</span>
      </div>
      <div class="view-body no-pad">
        <div class="graph-container" id="graph-container">
          <svg class="graph-svg" id="graph-svg" role="img" aria-label="Dependency graph"></svg>
          <div class="graph-controls">
            <button class="btn" id="zoom-in" data-tip="Zoom in" aria-label="Zoom in">+</button>
            <button class="btn" id="zoom-out" data-tip="Zoom out" aria-label="Zoom out">&minus;</button>
            <button class="btn" id="zoom-fit" data-tip="Fit graph to view" aria-label="Fit graph to view">&#x26F6;</button>
            <button class="btn" id="zoom-reset" data-tip="Reset zoom to 100%" aria-label="Reset zoom to 100%">1:1</button>
            <span class="zoom-level" id="zoom-level" aria-live="polite">100%</span>
          </div>
          <details class="graph-legend" id="graph-legend">
            <summary>Legend &amp; filters</summary>
            <div class="legend-body" id="legend-body"></div>
          </details>
          <div class="empty" id="graph-empty" hidden>
            <div class="empty-title">Nothing to draw</div>
            <p>No targets or jobs were found in this pipeline, so there is no graph to show.</p>
          </div>
        </div>
      </div>
    </section>

    <section class="view" id="view-catalog" role="tabpanel" aria-labelledby="tab-catalog">
      <div class="view-toolbar">
        <span class="toolbar-title">Tasks</span>
        <span class="toolbar-note" id="catalog-note"></span>
      </div>
      <div class="view-body" id="catalog-body"></div>
    </section>

    <section class="view" id="view-variables" role="tabpanel" aria-labelledby="tab-variables">
      <div class="view-toolbar">
        <span class="toolbar-title">Variables</span>
        <span class="toolbar-note" id="variables-note"></span>
        <span class="toolbar-spacer"></span>
        <input type="text" class="input" id="var-filter" placeholder="Filter by name…" aria-label="Filter variables by name">
      </div>
      <div class="view-body" id="variables-body"></div>
    </section>

    <section class="view" id="view-filemap" role="tabpanel" aria-labelledby="tab-filemap">
      <div class="view-toolbar">
        <span class="toolbar-title">Files</span>
        <span class="toolbar-note" id="filemap-note"></span>
        <span class="toolbar-spacer"></span>
        <button class="btn" id="tree-expand-all">Expand all</button>
        <button class="btn" id="tree-collapse-all">Collapse all</button>
      </div>
      <div class="view-body" id="filemap-body"></div>
    </section>

    <section class="view" id="view-whatif" role="tabpanel" aria-labelledby="tab-whatif">
      <div class="view-toolbar">
        <span class="toolbar-title">What-If</span>
        <span class="toolbar-note" id="whatif-note"></span>
        <span class="toolbar-spacer"></span>
        <span class="toolbar-note" id="wi-assumptions"
          data-tip="The simulation shows what GitLab would PROBABLY do. Unknowns are shown as 'depends', never guessed. Assumed world: branches main and dev exist and are protected; other branches are unprotected.">
          probable behavior — hover for assumptions</span>
        <button class="btn" id="wi-copy-text"
          data-tip="Copy the plain-text job listing (or the delta when a baseline is pinned)">Copy job list</button>
        <button class="btn" id="wi-copy-md"
          data-tip="Copy the job listing (or the delta) as markdown tables, ready to paste into an issue, MR or wiki">Copy markdown</button>
        <button class="btn" id="wi-export-scenario"
          data-tip="Copy the current scenario as a trigger-docs YAML stanza — paste it into the scenarios file that pipeview --trigger-docs reads">Export scenario</button>
        <button class="btn" id="wi-pin-baseline"
          data-tip="Freeze the current scenario as a baseline, then change any knob — the scenario preset included — to see what the change adds, removes, or alters">Pin as baseline</button>
        <label class="legend-item" style="min-height:0">
          <input type="checkbox" id="wi-show-skipped" checked>
          <span>show skipped jobs</span>
        </label>
      </div>
      <div class="view-body no-pad">
        <div class="whatif-layout">
          <aside class="whatif-controls" id="whatif-controls" aria-label="Scenario controls"></aside>
          <div class="whatif-results" id="whatif-results"></div>
        </div>
      </div>
    </section>

  </div>

  <div class="splitter" id="splitter" role="separator" aria-orientation="vertical"
       aria-label="Resize detail panel" tabindex="0"
       data-tip="Drag to resize. Double-click to reset."></div>

  <aside class="panel" id="detail-panel" aria-label="Detail panel">
    <div class="panel-header">
      <span class="panel-name" id="panel-name"></span>
      <button class="btn btn-quiet" id="panel-close" data-tip="Close panel" aria-label="Close detail panel">&times;</button>
    </div>
    <div class="panel-body" id="panel-body"></div>
  </aside>
</div>

<script>
