          + '</select></div>';
      }
      html += '</div>';
    }

    if (s.scenario === 'pr') {
      html += '<div class="wi-group"><h3>Pull request</h3>'
        + '<div class="wi-field"><label for="wi-feature-name">source (head) branch</label>'
        + '<input class="input" id="wi-feature-name" value="' + esc(s.featureName) + '"></div>'
        + '<div class="wi-field"><label for="wi-target-input">target (base) branch — branches: filters match THIS</label>'
        + '<input class="input" id="wi-target-input" value="' + esc(s.target || 'main') + '"></div>'
        + wiCheck('wi-draft', 'draft PR', s.draft,
          'Sets github.event.pull_request.draft — GitHub does not skip drafts unless your conditions say so')
        + '<div class="wi-field"><label for="wi-praction">action (types: filters match this; default: opened)</label>'
        + '<select class="input" id="wi-praction">'
        + '<option value=""' + (s.prAction ? '' : ' selected') + '>opened (default)</option>'
        + WI_PR_ACTIONS.map(a => '<option value="' + a + '"'
            + (s.prAction === a ? ' selected' : '') + '>' + a + '</option>').join('')
        + '</select></div>'
        + '</div>';
    } else if (s.scenario === 'push_branch' && s.openMR) {
      html += '<div class="wi-group"><h3>The open PR</h3>'
        + '<div class="wi-field"><label for="wi-target-input">target (base) branch</label>'
        + '<input class="input" id="wi-target-input" value="' + esc(s.target || 'main') + '"></div>'
        + wiCheck('wi-draft', 'draft PR', s.draft,
          'Sets github.event.pull_request.draft in the pull_request runs')
        + '</div>';
    }

    if (s.scenario === 'workflow_dispatch') {
      const dispatchable = wiDispatchable();
      html += '<div class="wi-group"><h3>Workflow</h3>'
        + '<div class="wi-field"><label for="wi-dispatch-workflow">workflow to dispatch</label>'
        + '<select class="input" id="wi-dispatch-workflow">'
        + '<option value=""' + (s.dispatchWorkflow ? '' : ' selected')
        + '>every dispatchable workflow (one run each)</option>'
        + dispatchable.map(f => '<option value="' + esc(f) + '"'
            + (s.dispatchWorkflow === f ? ' selected' : '') + '>' + esc(f)
            + '</option>').join('')
        + '</select></div>'
        + (s.dispatchWorkflow ? wiDispatchInputsHtml(s.dispatchWorkflow) : '')
        + '</div>';
    }

    html += '<div class="wi-group"><h3>Changed files</h3>'
      + wiRadio('wi-changed', 'unknown', 'unknown — leave “depends”', s.changedMode === 'unknown')
      + wiRadio('wi-changed', 'all', 'assume every pattern matches', s.changedMode === 'all')
      + wiRadio('wi-changed', 'none', 'assume nothing matches', s.changedMode === 'none')
      + wiRadio('wi-changed', 'list', 'exactly these paths…', s.changedMode === 'list')
      + '<div class="wi-field" id="wi-changed-field"' + (s.changedMode === 'list' ? '' : ' hidden')
      + '><label for="wi-changed-list">one path per line (what’s in the push / PR)</label>'
      + '<textarea class="input" id="wi-changed-list" spellcheck="false">'
      + esc(s.changedList) + '</textarea></div>'
      + '</div>';

    html += '<div class="wi-group"><h3>Commit message</h3>'
      + '<div class="wi-field"><input class="input" id="wi-commit-msg" aria-label="Commit message" placeholder="Update code" value="'
      + esc(s.commitMessage) + '"></div></div>';

    html += '<div class="wi-group"><h3>Variables '
      + '<span style="text-transform:none;letter-spacing:0">(pin unknowns: vars.NAME, secrets.NAME, github.repository, env names)</span></h3>'
      + '<div id="wi-var-rows">'
      + s.overrides.map((o, i) =>
          '<div class="wi-var-row" data-idx="' + i + '">'
          + '<input class="input wi-var-name" aria-label="Variable name" placeholder="vars.NAME" value="' + esc(o.name) + '">'
          + '<input class="input wi-var-value" aria-label="Variable value" placeholder="(empty string)" value="' + esc(o.value) + '">'
          + '<button class="btn btn-quiet wi-var-del" aria-label="Remove variable" data-tip="Remove">&times;</button></div>'
        ).join('')
      + '</div>'
      + '<div class="wi-inline-btns"><button class="btn" id="wi-var-add">+ variable</button></div>'
      + '<div class="legend-note">an empty value is the empty string — which is different from unset</div>'
      + '<div id="wi-unknown-list"></div>'
      + '</div>';

    wiControls.innerHTML = html;
    wireWiControls();
  }

  function renderWiControls() {
    if (WI_GH) renderWiControlsGH(); else renderWiControlsGL();
  }
  function wiConfig() {
    return WI_GH ? wiConfigGH() : wiConfigGL();
  }

  function wireWiControls() {
    wiControls.querySelectorAll('input[name="wi-scenario"]').forEach(el =>
      el.addEventListener('change', () => { wiState.scenario = el.value; wiRefresh(true); }));
    wiControls.querySelectorAll('input[name="wi-branch"]').forEach(el =>
      el.addEventListener('change', () => { wiState.branchKind = el.value; wiRefresh(true); }));
    wiControls.querySelectorAll('input[name="wi-changed"]').forEach(el =>
      el.addEventListener('change', () => { wiState.changedMode = el.value; wiRefresh(true); }));

    const bindText = (id, key) => {
      const el = document.getElementById(id);
      if (el) el.addEventListener('input', () => { wiState[key] = el.value; wiRefresh(false); });
    };
    bindText('wi-feature-name', 'featureName');
    bindText('wi-tag-name', 'tag');
    bindText('wi-changed-list', 'changedList');
    bindText('wi-commit-msg', 'commitMessage');
    bindText('wi-mr-labels', 'mrLabels');

    const bindCheck = (id, key) => {
      const el = document.getElementById(id);
      if (el) el.addEventListener('change', () => { wiState[key] = el.checked; wiRefresh(true); });
    };
    bindCheck('wi-openmr', 'openMR');
    bindCheck('wi-newbranch', 'newBranch');
    bindCheck('wi-draft', 'draft');
    bindCheck('wi-tag-protected', 'tagProtected');

    const bindSelect = (id, key) => {
      const el = document.getElementById(id);
      if (el) el.addEventListener('change', () => { wiState[key] = el.value; wiRefresh(false); });
    };
    bindSelect('wi-target', 'target');
    bindSelect('wi-flavor', 'mrFlavor');
    // GitHub-only knobs (the elements exist only in the GitHub controls;
    // every binding is a no-op when the element is absent)
    bindText('wi-target-input', 'target');
    bindSelect('wi-praction', 'prAction');
    bindSelect('wi-release-action', 'releaseAction');
    const dwEl = document.getElementById('wi-dispatch-workflow');
    if (dwEl) dwEl.addEventListener('change', () => {
      wiState.dispatchWorkflow = dwEl.value;
      wiState.dispatchInputs = {};   // a new workflow declares new inputs
      wiRefresh(true);
    });
    wiControls.querySelectorAll('.wi-dispatch-input').forEach(el => {
      const name = el.dataset.input;
      const ev = el.type === 'checkbox' || el.tagName === 'SELECT'
        ? 'change' : 'input';
      el.addEventListener(ev, () => {
        wiState.dispatchInputs[name] =
          el.type === 'checkbox' ? el.checked : el.value;
        wiRefresh(false);
      });
    });

    const addBtn = document.getElementById('wi-var-add');
    if (addBtn) addBtn.addEventListener('click', () => {
      wiState.overrides.push({ name: '', value: '' });
      wiRefresh(true);
      const rows = wiControls.querySelectorAll('.wi-var-name');
      if (rows.length) rows[rows.length - 1].focus();
    });
    wiControls.querySelectorAll('.wi-var-row').forEach(row => {
      const idx = parseInt(row.dataset.idx, 10);
      row.querySelector('.wi-var-name').addEventListener('input', e => {
        wiState.overrides[idx].name = e.target.value.trim(); wiRefresh(false);
      });
      row.querySelector('.wi-var-value').addEventListener('input', e => {
        wiState.overrides[idx].value = e.target.value; wiRefresh(false);
      });
      row.querySelector('.wi-var-del').addEventListener('click', () => {
        wiState.overrides.splice(idx, 1); wiRefresh(true);
      });
    });
  }

  // rebuildControls: structural knob changed (groups appear/disappear).
  // Plain text input → results only, debounced, focus preserved.
  function wiRefresh(rebuildControls) {
    if (rebuildControls) renderWiControls();
    clearTimeout(wiRenderTimer);
    wiRenderTimer = setTimeout(renderWiResults, rebuildControls ? 0 : 160);
  }

  /* ---------------- variables panel: three honest buckets ---------------- */

  const wiExprVars = Array.from(RULE_EXPR_VARS);   // sorted at collection

  function wiUpdateUnknownVars(result) {
    const box = document.getElementById('wi-unknown-list');
    if (!box) return;
    const defined = new Set(Object.keys(WHATIF.globals || {}));
    Object.keys(WHATIF.child_globals || {}).forEach(cg =>
      Object.keys(WHATIF.child_globals[cg]).forEach(k => defined.add(k)));
    REPORT.nodes.forEach(n => {
      const w = n.annotations && n.annotations.whatif;
      if (w) Object.keys(w.variables || {}).forEach(k => defined.add(k));
      if (w) Object.keys(w.env || {}).forEach(k => {
        defined.add(k); defined.add('env.' + k.toLowerCase());
      });
    });
    if (WHATIF.workflow) (WHATIF.workflow.rules || []).forEach(r =>
      Object.keys(r.variables || {}).forEach(k => defined.add(k)));
    Object.keys(WHATIF.workflows || {}).forEach(f => {
      const wf = WHATIF.workflows[f];
      Object.keys(wf.env || {}).forEach(k => {
        defined.add(k); defined.add('env.' + k.toLowerCase());
      });
      ['workflow_dispatch', 'workflow_call'].forEach(t => {
        const inp = ((wf.on || {})[t] || {}).inputs || {};
        Object.keys(inp).forEach(k =>
          defined.add('inputs.' + k.toLowerCase()));
      });
    });
    wiState.overrides.forEach(o => {
      if (o.name) { defined.add(o.name); defined.add(o.name.toLowerCase()); }
    });

    const envSet = new Set();
    const decided = new Set();
    let prefixes = [];
    result.candidates.forEach(c => {
      Object.keys(c.env).forEach(k => envSet.add(k));
      (c.controlled.names || []).forEach(n => decided.add(n));
      prefixes = c.controlled.prefixes || prefixes;
    });

    const runtime = [], unsetType = [], nowhere = [];
    wiExprVars.forEach(name => {
      if (defined.has(name) || envSet.has(name)) return;
      const isPre = IS_GH
        ? (/^(GITHUB|RUNNER)_/.test(name) || name === 'CI'
           || /^(github|runner|secrets|vars|needs|inputs)\./.test(name))
        : /^(CI|GITLAB)_/.test(name);
      const isDecided = decided.has(name)
        || prefixes.some(p => name.indexOf(p) === 0);
      if (isPre && isDecided) unsetType.push(name);
      else if (isPre) runtime.push(name);
      else nowhere.push(name);
    });

    const rows = (names, btn) => names.map(name => {
      const tip = preDocTip(name);
      const label = tip
        ? '<span class="pre-doc" data-tip="' + esc(name + ' — ' + tip) + '">'
          + '<span class="clip">' + esc(name) + '</span></span>'
        : '<span class="clip" title="' + esc(name) + '">' + esc(name) + '</span>';
      return '<div class="wi-unknown-var">' + label
        + '<button class="btn wi-set-var" data-var="'
        + esc(name) + '">' + btn + '</button></div>';
    }).join('');
    let html = '';
    if (runtime.length) {
      html += '<div class="legend-note" style="margin-top:var(--sp-2)">'
        + VENDOR + ' sets these at run time — <b>not simulated</b>; conditions '
        + 'using them show “depends” until you pin a value:</div>'
        + rows(runtime, 'pin');
    }
    if (unsetType.length) {
      html += '<div class="legend-note" style="margin-top:var(--sp-2)">'
        + 'predefined, but <b>unset in this pipeline type</b> (that is usually '
        + 'the point of the rule):</div>' + rows(unsetType, 'set');
    }
    if (nowhere.length) {
      html += '<div class="legend-note" style="margin-top:var(--sp-2)">'
        + 'defined nowhere — currently <b>unset</b>:</div>' + rows(nowhere, 'set');
    }
    box.innerHTML = html;
    box.querySelectorAll('.wi-set-var').forEach(btn =>
      btn.addEventListener('click', () => {
        wiState.overrides.push({ name: btn.dataset.var, value: '' });
        wiRefresh(true);
        const rowEls = wiControls.querySelectorAll('.wi-var-value');
        if (rowEls.length) rowEls[rowEls.length - 1].focus();
      }));
  }

  /* ---------------- results rendering ---------------- */

  function wiOutcomeSummary(out) {
    if (!out) return '';
    if (out.state === 'conditional') return 'depends on: ' + out.condition;
    if (out.state === 'runs') {
      return out.when === 'on_failure'
        ? 'runs only after an earlier job fails'
        : 'runs (when: ' + (out.when || 'on_success') + ')';
    }
    if (out.state === 'manual') {
      return 'manual gate' + (out.allow_failure === false
        ? ' (blocking — the pipeline waits)' : ' (optional)');
    }
    if (out.state === 'delayed') return 'delayed' + (out.start_in ? ' ' + out.start_in : '');
    if (out.state === 'skipped') {
      return out.reason ? 'skipped — ' + out.reason
        : 'skipped (matched a when: never rule)';
    }
    return 'not added (' + (out.reason || 'no rule matched') + ')';
  }

  function wiSafeId(s) { return s.replace(/[^A-Za-z0-9_-]/g, '-'); }

  // per-candidate edges: needs from the compiled programs, stage ordering
  // recomputed for THIS candidate's included set (the full-config edges
  // would point at jobs that aren't in this pipeline)
  function wiEdgesFor(cand, ids, idSet) {
    // rules:needs replaces a job's needs when the rule matched — the drawn
    // edges must follow the evaluation, not the static config
    const effectiveNeeds = id => {
      const w = nodeMap[id].annotations.whatif;
      const out = cand.jobs[id];
      if (out && !out.needsUncertain && out.needsOverride !== undefined) {
        return out.needsOverride;
      }
      return w.needs;
    };
    const edges = [];
    ids.forEach(id => {
      const w = nodeMap[id].annotations.whatif;
      (effectiveNeeds(id) || []).forEach(need => {
        if (need.kind) return;
        const prefix = w.child_of ? w.child_of + '::'
        : (w.provider === 'github' && w.workflow) ? w.workflow + '::' : '';
      const tid = prefix + need.job;
        if (idSet.has(tid)) edges.push({ src: id, dst: tid, kind: 'needs' });
      });
    });
    const stages = WHATIF.stages || [];
    const byStage = {};
    ids.forEach(id => {
      const st = nodeMap[id].annotations.whatif.stage;
      (byStage[st] = byStage[st] || []).push(id);
    });
    ids.forEach(id => {
      const w = nodeMap[id].annotations.whatif;
      const needs = effectiveNeeds(id);
      if (needs !== null && needs !== undefined) return;  // [] = starts immediately
      for (let i = stages.indexOf(w.stage) - 1; i >= 0; i--) {
        const prev = byStage[stages[i]];
        if (prev && prev.length) {
          prev.forEach(pid => edges.push({ src: id, dst: pid, kind: 'stage_order' }));
          break;
        }
      }
    });
    return edges;
  }

  function wiGraphSvg(cand) {
    const show = wiShowSkippedEl.checked;
    const ids = cand.jobOrder.filter(id => show || wiMight(cand.jobs[id]));
    if (!ids.length) {
      return '<div class="wi-pipe-reason">No jobs to draw'
        + (show ? '' : ' — skipped jobs are hidden') + '.</div>';
    }
    if (typeof dagre === 'undefined') {
      return '<div class="wi-pipe-reason">' + ids.map(id => esc(nodeMap[id].name)).join(' · ')
        + '</div>';
    }
    const idSet = new Set(ids);
    const g = new dagre.graphlib.Graph();
    g.setGraph({ rankdir: 'LR', nodesep: 18, ranksep: 48, marginx: 14, marginy: 14 });
    g.setDefaultEdgeLabel(() => ({}));
    ids.forEach(id => {
      const w = nodeMap[id].annotations.whatif;
      const res = cand.jobs[id];
      const label = midTrunc(nodeMap[id].name, 24);
      let stateText = res.when === 'on_failure'
        ? 'on failure only' : (WI_STATE_LABEL[res.state] || res.state);
      if (res.matrixPartial && res.matrix) {
        const r = res.matrix.filter(m =>
          ['runs', 'manual', 'delayed', 'conditional'].indexOf(m.state) >= 0).length;
        stateText = r + '/' + res.matrix.length + ' instances run';
      } else if (res.matrixCount) {
        stateText += ' ×' + res.matrixCount;
      }
      const sub = w.stage + ' · ' + stateText;
      g.setNode(id, {
        label, sub,
        width: Math.max(92, Math.max(label.length * 6.8, sub.length * 5.4) + 24),
        height: 42
      });
    });
    // Model edges point job → dependency; pipelines read better as
    // execution flow, so draw dependency → dependent (build on the left).
    wiEdgesFor(cand, ids, idSet).forEach(e => g.setEdge(e.dst, e.src, { kind: e.kind }));
    dagre.layout(g);
    const gr = g.graph();
    const w = Math.max(gr.width || 200, 60), h = Math.max(gr.height || 80, 60);
    const marker = 'wi-arrow-' + wiSafeId(cand.id);

    let svg = '<svg width="' + w + '" height="' + h + '" role="img" aria-label="'
      + esc(cand.label) + ' jobs">'
      + '<defs><marker id="' + marker + '" markerWidth="9" markerHeight="7" refX="8" refY="3.5"'
      + ' orient="auto" markerUnits="userSpaceOnUse">'
      + '<polygon points="0 0,8 3.5,0 7" fill="var(--edge-needs)"/></marker></defs>';

    g.edges().forEach(e => {
      const edge = g.edge(e);
      const pts = edge.points || [];
      if (pts.length < 2) return;
      let d = 'M' + pts[0].x + ',' + pts[0].y;
      for (let i = 1; i < pts.length; i++) d += ' L' + pts[i].x + ',' + pts[i].y;
      svg += '<path class="wi-edge kind-' + edge.kind + '" d="' + d
        + '" marker-end="url(#' + marker + ')"/>';
    });

    g.nodes().forEach(id => {
      const lo = g.node(id);
      if (!lo) return;
      const res = cand.jobs[id];
      const x = lo.x - lo.width / 2, y = lo.y - lo.height / 2;
      const dup = wiDupSet.has(id);
      const firstNote = (res.trace && res.trace.length)
        ? res.trace[res.trace.length - 1].desc : '';
      svg += '<g class="wi-node st-' + res.state + (dup ? ' wi-dup' : '')
        + '" data-job="' + esc(id) + '" data-cand="' + esc(cand.id) + '" tabindex="0">'
        + '<title>' + esc(nodeMap[id].name) + ' — ' + esc(lo.sub)
        + (dup ? ' · DUPLICATE: may run in more than one pipeline for this event' : '')
        + (firstNote ? '\n' + esc(firstNote) : '') + '</title>'
        + '<rect x="' + x + '" y="' + y + '" width="' + lo.width + '" height="' + lo.height + '" rx="5"/>'
        + '<text x="' + lo.x + '" y="' + lo.y + '" text-anchor="middle">' + esc(lo.label) + '</text>'
        + '<text class="wi-state-label" x="' + lo.x + '" y="' + (lo.y + 14) + '" text-anchor="middle">'
        + esc(lo.sub) + '</text>'
        + (dup ? '<circle class="wi-dup-badge" cx="' + (x + lo.width - 1) + '" cy="' + (y + 1) + '" r="5"/>' : '')
        + '</g>';
    });
    return '<div class="wi-graph">' + svg + '</svg></div>';
  }

  function wiCandChips(cand) {
    let chips = '<span class="chip">' + esc(cand.source) + '</span>'
      + '<span class="chip" style="font-family:var(--font-mono)">' + esc(cand.ref) + '</span>';
    if (wiFatalActive) {
      chips += '<span class="chip chip-error" data-tip="The configuration is invalid — ' + VENDOR + ' refuses to create any pipeline">✖ invalid config</span>';
    } else if (cand.created === true && cand.creationFails) {
      chips += '<span class="chip chip-error" data-tip="A needs/dependencies problem in this pipeline makes ' + VENDOR + ' fail to create it">✖ creation fails</span>';
    } else if (cand.created === true) chips += '<span class="chip chip-ok">✓ created</span>';
    else if (cand.created === false) chips += '<span class="chip chip-error">✖ not created</span>';
    else chips += '<span class="chip chip-info" data-tip="' + esc(cand.reason || '') + '">? depends</span>';
    const counts = {};
    cand.jobOrder.forEach(id => {
      counts[cand.jobs[id].state] = (counts[cand.jobs[id].state] || 0) + 1;
    });
    const bits = [];
    ['runs', 'manual', 'delayed', 'conditional', 'skipped', 'not-added'].forEach(s => {
      if (counts[s]) bits.push(counts[s] + ' ' + (WI_STATE_LABEL[s] || s));
    });
    if (bits.length) chips += '<span class="toolbar-note">' + esc(bits.join(' · ')) + '</span>';
    return chips;
  }

  function wiDiag(kind, message) {
    const sev = kind === 'error' ? 'error' : kind === 'warning' ? 'warning' : 'info';
    const icon = sev === 'error' ? '✖' : sev === 'warning' ? '⚠' : 'ⓘ';
    return '<div class="diag-item ' + sev + '"><span class="diag-sev">' + icon
      + '</span><span class="diag-msg">' + message + '</span></div>';
  }

  function wiEnvTable(cand) {
    // mirrors the evaluation layering: predefined < yaml < workflow <
    // forwarded (trigger:forward, pipeline precedence) < overrides
    const globalsFor = cand.childOf
      ? ((WHATIF.child_globals || {})[cand.childOf] || {})
      : (WHATIF.globals || {});
    const overrideMap = {};
    wiState.overrides.forEach(o => { if (o.name) overrideMap[o.name] = o.value; });
    const wfVars = cand.workflowVariables || {};
    const fwdVars = cand.forwardedVars || {};
    const merged = Object.assign({}, cand.env, globalsFor, wfVars, fwdVars, overrideMap);
    const rows = Object.keys(merged).sort().map(name => {
      const origin = Object.prototype.hasOwnProperty.call(overrideMap, name) ? 'override'
        : Object.prototype.hasOwnProperty.call(fwdVars, name) ? 'forwarded'
        : Object.prototype.hasOwnProperty.call(wfVars, name) ? 'workflow'
        : Object.prototype.hasOwnProperty.call(globalsFor, name) ? 'YAML' : 'predefined';
      const nameHtml = origin === 'predefined'
        ? preDocWrap(name, '<code>' + esc(name) + '</code>')
        : '<code>' + esc(name) + '</code>';
      return '<tr><td>' + nameHtml + '</td>'
        + '<td class="wrap-any"><code>' + esc(merged[name]) + '</code></td>'
        + '<td><span class="chip">' + origin + '</span></td></tr>';
    });
    return '<details class="wi-env"><summary>variables in effect (' + rows.length
      + ') — anything else predefined is set at runtime, anything else custom is unset</summary>'
      + '<table>' + rows.join('') + '</table></details>';
  }

  function renderWiPipeline(cand) {
    const dead = cand.created === false;
    let html = '<section class="wi-pipeline' + (dead ? ' wi-dead' : '') + '">'
      + '<div class="wi-pipe-head"><span class="wi-pipe-title">' + esc(cand.label)
      + '</span>' + wiCandChips(cand) + '</div>';
    if (dead) {
      html += '<div class="wi-pipe-reason">' + esc(cand.reason || 'not created') + '</div></section>';
      return html;
    }
    const banners = [];
    cand.artifacts.errors.forEach(e => banners.push(wiDiag('error', esc(e.message))));
    // dotenv notes collapse to one line per producer; the rest stay individual
    const dotenvByProducer = {};
    const seen = new Set();
    cand.artifacts.notes.forEach(n => {
      if (n.kind === 'dotenv' && n.producer) {
        (dotenvByProducer[n.producer] = dotenvByProducer[n.producer] || []).push(n.job);
        return;
      }
      if (seen.has(n.message) || banners.length >= 9) return;
      seen.add(n.message);
      banners.push(wiDiag(
        n.kind === 'conditional-need' || n.kind === 'workflow-vars'
          || n.kind === 'manual-producer' || n.kind === 'env-stop'
          ? 'warning' : 'info',
        esc(n.message)));
    });
    Object.keys(dotenvByProducer).forEach(producer => {
      const consumers = Array.from(new Set(dotenvByProducer[producer]))
        .map(id => nodeMap[id] ? nodeMap[id].name : id);
      banners.push(wiDiag('info', 'Variables from <code>'
        + esc(nodeMap[producer] ? nodeMap[producer].name : producer)
        + '</code>’s dotenv report extend the runtime env of: '
        + consumers.map(c => '<code>' + esc(c) + '</code>').join(', ')
        + ' — dotenv variables can never affect rules (rules evaluate before any job runs).'));
    });
    if (cand.created === null) {
      banners.unshift(wiDiag('warning',
        'Whether this pipeline is created at all ' + esc(cand.reason || 'is uncertain')));
    }
    if (banners.length) html += '<div class="wi-pipe-banners">' + banners.join('') + '</div>';
    html += wiEnvTable(cand);
    html += wiGraphSvg(cand);
    if (cand.children && cand.children.length) {
      html += '<div class="wi-children">'
        + '<div class="legend-note" style="margin-bottom:var(--sp-1)">'
        + (WI_GH
            ? 'downstream runs (called reusable workflows run as part of the caller; '
              + 'workflow_run-triggered workflows start after this one completes)'
            : 'child pipelines (CI_PIPELINE_SOURCE becomes parent_pipeline in here — '
              + 'merge_request_event rules never match; the child evaluates its own '
              + 'workflow:rules)')
        + '</div>'
        + cand.children.map(renderWiPipeline).join('') + '</div>';
    }
    html += '</section>';
    return html;
  }

  function wiLegendChip(color, style, label) {
    return '<span class="chip" style="border:1.5px ' + style + ' ' + color + '">'
      + esc(label) + '</span>';
  }

  let wiFatalActive = false;

  function wiCountCreated(list) {
    let n = 0;
    (list || []).forEach(c => {
      if (c.created !== false && !c.creationFails) n += 1;
      n += wiCountCreated(c.children);
    });
    return n;
  }

  function renderWiResults() {
    if (!whatifAvailable) return;
    const cfg = wiConfig();
    let result;
    try {
      result = WIENGINE.evaluateEvent(REPORT, cfg);
    } catch (err) {
      wiResults.innerHTML = '<div class="empty"><div class="empty-title">Simulation failed</div><p>'
        + esc(String(err)) + '</p></div>';
      return;
    }
    wiLastResult = result;
    wiDupSet = new Set(result.duplicates.map(d => d.job));
    // mode-dependent chrome: the copy button says what it copies, and the
    // skipped-jobs toggle only applies to the normal per-pipeline graphs
    wiCopyBtn.textContent = wiCopyLabel();
    wiMdBtn.textContent = wiMdLabel();
    wiShowSkippedEl.disabled = !!wiBaseline;
    const skipLabel = wiShowSkippedEl.closest('label');
    if (skipLabel) {
      if (wiBaseline) {
        skipLabel.dataset.tip = 'Not used while comparing — delta graphs always '
          + 'show the union of jobs that would run on either side';
      } else {
        delete skipLabel.dataset.tip;
      }
    }
    if (wiBaseline) { renderWiDelta(result, cfg); return; }
    const fatal = result.fatal || [];
    wiFatalActive = fatal.length > 0;
    const topCountEarly = result.candidates.length;
    const createdAllEarly = wiFatalActive ? 0 : wiCountCreated(result.candidates);

    const strip = [];
    if (fatal.length) {
      strip.push(wiDiag('error',
        '<b>Invalid configuration — ' + VENDOR + ' refuses to create ANY pipeline:</b><br>'
        + fatal.map(f => esc(f.message)).join('<br>')));
    } else if (topCountEarly > 0 && createdAllEarly === 0) {
      strip.push(wiDiag('warning',
        '<b>This event produces NO pipelines</b> — every candidate is '
        + 'suppressed or fails creation.'));
    }
    if (result.duplicates.length) {
      const names = result.duplicates.map(d =>
        '<code>' + esc(nodeMap[d.job] ? nodeMap[d.job].name : d.job)
        + (d.instances ? ' ×' + d.instances : '') + '</code>').join(', ');
      strip.push(wiDiag('warning', '<b>' + result.duplicates.length
        + ' duplicate job' + (result.duplicates.length > 1 ? 's' : '')
        + ':</b> ' + names + ' — may run in more than one '
        + (WI_GH ? 'workflow run' : 'pipeline') + ' for this single event. '
        + (WI_GH
            ? 'The usual fix is a branch filter on the push trigger (or dropping one trigger).'
            : 'The usual fix is the documented <code>workflow:rules</code> dedup pattern.')));
    }
    const rgDups = result.duplicates.filter(d => d.resource_group);
    if (rgDups.length) {
      strip.push(wiDiag('info', rgDups.map(d =>
        '<code>' + esc(nodeMap[d.job] ? nodeMap[d.job].name : d.job)
        + '</code> runs in ' + d.candidates.length + ' pipelines but shares '
        + '<code>resource_group: ' + esc(d.resource_group) + '</code> — the '
        + 'runs serialize, order undefined').join('<br>')));
    }
    if (result.crossPipelineArtifacts) {
      strip.push(wiDiag('info', 'More than one of these pipelines produces artifacts on the '
        + 'same ref — anything that fetches artifacts <i>by ref</i> (downstream projects, '
        + '“latest artifacts” links) may get either pipeline’s output.'));
    }
    if (result.lint.length) {
      strip.push('<details><summary class="toolbar-note" style="cursor:pointer">'
        + result.lint.length + ' static warning' + (result.lint.length > 1 ? 's' : '')
        + ' (independent of this scenario)</summary>'
        + result.lint.map(l => wiDiag('warning', esc(l.message))).join('') + '</details>');
    }

    const legend = '<div class="wi-legend">'
      + wiLegendChip('var(--ok)', 'solid', 'runs')
      + wiLegendChip('var(--warn)', 'solid', 'manual gate')
      + wiLegendChip('var(--warn)', 'dashed', 'delayed')
      + wiLegendChip('var(--info)', 'dotted', 'depends (unknown)')
      + '<span class="chip" style="opacity:.55;border-style:dashed">skipped / not added</span>'
      + '<span class="chip"><span style="color:var(--warn)">●</span> duplicate</span>'
      + '</div>';

    const topCount = topCountEarly;
    const createdAll = createdAllEarly;
    document.getElementById('count-whatif').textContent = ' ' + createdAll;
    const nested = wiFatalActive ? 0 : createdAll
      - result.candidates.filter(c => c.created !== false && !c.creationFails).length;
    wiNoteEl.textContent = topCount + ' candidate '
      + (WI_GH ? 'workflow run' : 'pipeline')
      + (topCount > 1 ? 's' : '') + ' · ' + createdAll + ' would run'
      + (wiFatalActive ? ' (configuration invalid)'
         : nested ? ' (' + nested + ' nested)' : '');

    wiCopyText = WIENGINE.textSummary(REPORT, result, cfg);
    wiCopyMd = WIENGINE.markdownSummary(REPORT, result, cfg);
    wiResults.innerHTML = legend
      + (strip.length ? '<div class="wi-banner-strip">' + strip.join('') + '</div>' : '')
      + wiTextBlock('plain-text job listing (for copy/paste)')
      + result.candidates.map(renderWiPipeline).join('');
    wiFillTextBlock();
    wireWiNodes();
    wiUpdateUnknownVars(result);
  }

  function wiTextBlock(title) {
    return '<details class="wi-text" id="wi-text-details"' + (wiTextOpen ? ' open' : '')
      + '><summary>' + esc(title) + '</summary><pre id="wi-text-pre"></pre></details>';
  }

  // textContent, not innerHTML — the listing is verbatim text
  function wiFillTextBlock() {
    const pre = document.getElementById('wi-text-pre');
    if (pre) pre.textContent = wiCopyText;
    const det = document.getElementById('wi-text-details');
    if (det) det.addEventListener('toggle', () => { wiTextOpen = det.open; });
  }

  function wireWiNodes() {
    wiResults.querySelectorAll('.wi-node').forEach(el => {
      const open = () => showWiJobDetail(el.dataset.job, el.dataset.cand, el.dataset.side);
      el.addEventListener('click', ev => { ev.stopPropagation(); open(); });
      el.addEventListener('keydown', ev => {
        if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); open(); }
      });
      el.addEventListener('mouseenter', () => wiHighlight(el.dataset.job, true));
      el.addEventListener('mouseleave', () => wiHighlight(el.dataset.job, false));
    });
  }

  /* ---------------- delta mode (a baseline is pinned) ---------------- */

  function renderWiDelta(result, cfg) {
    const curLabel = WIENGINE.describeConfig(cfg);
    const diff = WIENGINE.diffEvents(wiBaseline.result, result);
    wiCopyText = WIENGINE.textDiff(REPORT, diff, wiBaseline.label, curLabel);
    wiCopyMd = WIENGINE.markdownDiff(REPORT, diff, wiBaseline.label, curLabel);
    const c = diff.counts;
    const identical = !c.added && !c.removed && !c.changed;

    document.getElementById('count-whatif').textContent =
      ' Δ' + (c.added + c.removed + c.changed);
    wiNoteEl.textContent = 'delta vs baseline · ' + c.added + ' added · '
      + c.removed + ' removed · ' + c.changed + ' changed';

    const legend = '<div class="wi-legend">'
      + wiLegendChip('var(--ok)', 'solid', 'added')
      + wiLegendChip('var(--error)', 'dashed', 'removed')
      + wiLegendChip('var(--warn)', 'solid', 'state changed')
      + '<span class="chip">unchanged</span>'
      + '</div>';

    const strip = [];
    if ((result.fatal || []).length) {
      strip.push(wiDiag('error',
        '<b>Invalid configuration — ' + VENDOR + ' refuses to create ANY pipeline:</b><br>'
        + result.fatal.map(f => esc(f.message)).join('<br>')));
    }
    // pipeline-level status is the headline when it explains the counts —
    // "4 removed" misleads if the truth is "the tag pipeline fails creation"
    const pipeNotes = [];
    diff.pairs.forEach(p => {
      const note = (cnd, side) => {
        if (!cnd) return;
        if (cnd.creationFails) {
          pipeNotes.push(esc(cnd.label) + ' — ' + side
            + ': creation fails, so its jobs count as not running');
        } else if (cnd.created === false) {
          pipeNotes.push(esc(cnd.label) + ' — ' + side + ': not created ('
            + esc(cnd.reason || 'suppressed') + ')');
        } else if (cnd.created === null) {
          pipeNotes.push(esc(cnd.label) + ' — ' + side + ': whether it is created depends');
        }
      };
      note(p.a, 'baseline');
      note(p.b, 'current');
    });
    strip.push(wiDiag('info', '<b>Comparing against the pinned baseline.</b><br>'
      + 'baseline: ' + esc(wiBaseline.label) + '<br>'
      + 'current: ' + esc(curLabel) + '<br>'
      + (identical
          ? '<b>no differences</b> — both configurations run the same jobs the same way'
          : c.added + ' added, ' + c.removed + ' removed, ' + c.changed
            + ' changed, ' + c.same + ' unchanged')
      + (pipeNotes.length ? '<br>' + pipeNotes.join('<br>') : '')));

    wiResults.innerHTML = legend
      + '<div class="wi-banner-strip">' + strip.join('') + '</div>'
      + wiTextBlock('plain-text delta (for copy/paste)')
      + diff.pairs.map(renderWiDeltaPair).join('');
    wiFillTextBlock();
    wireWiNodes();
    wiUpdateUnknownVars(result);
  }

  function renderWiDeltaPair(pair) {
    const cand = pair.b || pair.a;
    // arrow forms only where the value actually differs — "push → push" is noise
    const arrow = (a, b) => (pair.a && pair.b && a !== b) ? a + ' → ' + b
      : (pair.b ? b : a);
    const title = pair.a && pair.b && pair.a.label !== pair.b.label
      ? esc(pair.a.label) + ' → ' + esc(pair.b.label)
      : esc(cand.label);
    let chips = '<span class="chip">'
      + esc(arrow(pair.a && pair.a.source, pair.b && pair.b.source)) + '</span>'
      + '<span class="chip" style="font-family:var(--font-mono)">'
      + esc(arrow(pair.a && pair.a.ref, pair.b && pair.b.ref)) + '</span>';
    if (!pair.a) chips += '<span class="chip chip-ok">pipeline added</span>';
    else if (!pair.b) chips += '<span class="chip chip-error">pipeline removed</span>';
    const sideChip = (cnd, side) => {
      if (!cnd) return '';
      if (cnd.created === false) {
        return '<span class="chip chip-error" data-tip="' + esc(cnd.reason || '')
          + '">' + side + ': not created</span>';
      }
      if (cnd.creationFails) {
        return '<span class="chip chip-error">' + side + ': creation fails</span>';
      }
      if (cnd.created === null) {
        return '<span class="chip chip-info" data-tip="' + esc(cnd.reason || '')
          + '">' + side + ': depends</span>';
      }
      return '';
    };
    chips += sideChip(pair.a, 'baseline') + sideChip(pair.b, 'current');
    return '<section class="wi-pipeline">'
      + '<div class="wi-pipe-head"><span class="wi-pipe-title">' + title
      + '</span>' + chips + '</div>'
      + wiDeltaGraphSvg(pair)
      + '</section>';
  }

  // Union edges: each side's edges over its own might-run set (so
  // stage-order fallbacks stay true to that side's pipeline), deduped.
  function wiDeltaEdges(pair) {
    const seen = new Set(), out = [];
    const addSide = cnd => {
      if (!cnd || cnd.created === false || cnd.creationFails) return;
      const ids = pair.ids.filter(id => cnd.jobs[id] && wiMight(cnd.jobs[id]));
      const idSet = new Set(ids);
      wiEdgesFor(cnd, ids, idSet).forEach(e => {
        const k = e.src + '|' + e.dst + '|' + e.kind;
        if (!seen.has(k)) { seen.add(k); out.push(e); }
      });
    };
    addSide(pair.b);
    addSide(pair.a);
    return out;
  }

  function wiDeltaGraphSvg(pair) {
    const ids = pair.ids;
    if (!ids.length) {
      return '<div class="wi-pipe-reason">No jobs would run on either side.</div>';
    }
    if (typeof dagre === 'undefined') {
      return '<div class="wi-pipe-reason">' + ids.map(id => esc(nodeMap[id].name)).join(' · ')
        + '</div>';
    }
    const stLabel = o => {
      let t = o.when === 'on_failure'
        ? 'on failure only' : (WI_STATE_LABEL[o.state] || o.state);
      if (o.matrixCount) t += ' ×' + o.matrixCount;
      return t;
    };
    const g = new dagre.graphlib.Graph();
    g.setGraph({ rankdir: 'LR', nodesep: 18, ranksep: 48, marginx: 14, marginy: 14 });
    g.setDefaultEdgeLabel(() => ({}));
    ids.forEach(id => {
      const d = pair.deltas[id];
      const aOut = pair.a ? pair.a.jobs[id] : null;
      const bOut = pair.b ? pair.b.jobs[id] : null;
      const label = midTrunc(nodeMap[id].name, 24);
      let sub;
      if (d === 'added') sub = 'added · ' + stLabel(bOut);
      else if (d === 'removed') sub = 'removed · was ' + stLabel(aOut);
      else if (d === 'changed') sub = stLabel(aOut) + ' → ' + stLabel(bOut);
      else sub = nodeMap[id].annotations.whatif.stage + ' · ' + stLabel(bOut);
      g.setNode(id, {
        label, sub,
        width: Math.max(92, Math.max(label.length * 6.8, sub.length * 5.4) + 24),
        height: 42
      });
    });
    wiDeltaEdges(pair).forEach(e => g.setEdge(e.dst, e.src, { kind: e.kind }));
    dagre.layout(g);
    const gr = g.graph();
    const w = Math.max(gr.width || 200, 60), h = Math.max(gr.height || 80, 60);
    const marker = 'wi-arrow-' + wiSafeId('d-' + pair.key);

    let svg = '<svg width="' + w + '" height="' + h + '" role="img" aria-label="'
      + esc((pair.b || pair.a).label) + ' delta">'
      + '<defs><marker id="' + marker + '" markerWidth="9" markerHeight="7" refX="8" refY="3.5"'
      + ' orient="auto" markerUnits="userSpaceOnUse">'
      + '<polygon points="0 0,8 3.5,0 7" fill="var(--edge-needs)"/></marker></defs>';

    g.edges().forEach(e => {
      const edge = g.edge(e);
      const pts = edge.points || [];
      if (pts.length < 2) return;
      let d = 'M' + pts[0].x + ',' + pts[0].y;
      for (let i = 1; i < pts.length; i++) d += ' L' + pts[i].x + ',' + pts[i].y;
      svg += '<path class="wi-edge kind-' + edge.kind + '" d="' + d
        + '" marker-end="url(#' + marker + ')"/>';
    });

    g.nodes().forEach(id => {
      const lo = g.node(id);
      if (!lo) return;
      const d = pair.deltas[id];
      // detail panel prefers the side where the job still runs
      const side = pair.b && pair.b.jobs[id] && wiMight(pair.b.jobs[id]) ? 'cur' : 'base';
      const cnd = side === 'cur' ? pair.b : pair.a;
      const res = cnd.jobs[id];
      const x = lo.x - lo.width / 2, y = lo.y - lo.height / 2;
      svg += '<g class="wi-node st-' + res.state + (d !== 'same' ? ' d-' + d : '')
        + '" data-job="' + esc(id) + '" data-cand="' + esc(cnd.id)
        + '" data-side="' + side + '" tabindex="0">'
        + '<title>' + esc(nodeMap[id].name) + ' — ' + esc(lo.sub) + '</title>'
        + '<rect x="' + x + '" y="' + y + '" width="' + lo.width + '" height="' + lo.height + '" rx="5"/>'
        + '<text x="' + lo.x + '" y="' + lo.y + '" text-anchor="middle">' + esc(lo.label) + '</text>'
        + '<text class="wi-state-label" x="' + lo.x + '" y="' + (lo.y + 14) + '" text-anchor="middle">'
        + esc(lo.sub) + '</text>'
        + '</g>';
    });
    return '<div class="wi-graph">' + svg + '</svg></div>';
  }

  function wiHighlight(jobId, on) {
    wiResults.querySelectorAll('.wi-node').forEach(el => {
      el.classList.toggle('wi-hl', on && el.dataset.job === jobId);
    });
  }

  function wiFindCandidate(candId, fromBaseline) {
    function walk(list) {
      for (const c of (list || [])) {
        if (c.id === candId) return c;
        const hit = walk(c.children);
        if (hit) return hit;
      }
      return null;
    }
    const result = fromBaseline ? (wiBaseline && wiBaseline.result) : wiLastResult;
    return result ? walk(result.candidates) : null;
  }

  function wiVarsLine(vars) {
    if (!vars || !vars.length) return '';
    return '<div class="tl-note">' + vars.map(v =>
      preDocWrap(v.name, '$' + esc(v.name)) + (v.runtime
        ? ' = set at runtime (not simulated)'
        : v.value === null ? ' is unset'
        : ' = "' + esc(v.value) + '"')).join(' · ') + '</div>';
  }

  function wiTraceHtml(res) {
    if (!res.trace || !res.trace.length) return '';
    const VERDICT_CHIP = {
      matched: 'chip-ok', 'no match': '', unknown: 'chip-info', end: ''
    };
    let afterUnknown = false;
    return '<ol class="timeline">' + res.trace.map(t => {
      const label = t.rule === null ? '' : 'rule ' + (t.rule + 1) + ': ';
      // a collapsed verdict is definite — no contingency chips
      const contingent = !res.collapsed && afterUnknown && t.verdict !== 'unknown';
      if (t.verdict === 'unknown') afterUnknown = true;
      return '<li class="tl-event"><div class="tl-head">'
        + '<span class="chip ' + (VERDICT_CHIP[t.verdict] || '') + '">' + esc(t.verdict) + '</span>'
        + (t.when ? '<span class="chip chip-warn">when: ' + esc(t.when) + '</span>' : '')
        + (contingent ? '<span class="chip" data-tip="This rule is only reached if the unknown rule above does not match">contingent</span>' : '')
        + '</div><div class="tl-value">' + esc(label + t.desc) + '</div>'
        + wiVarsLine(t.vars)
        + (t.notes && t.notes.length
            ? '<div class="tl-note">' + t.notes.map(esc).join('<br>') + '</div>' : '')
        + '</li>';
    }).join('') + '</ol>';
  }

  function showWiJobDetail(jobId, candId, side) {
    const node = nodeMap[jobId];
    const fromBaseline = side === 'base';
    const cand = wiFindCandidate(candId, fromBaseline);
    if (!node || !cand) return;
    const res = cand.jobs[jobId];
    openPanel();
    panelName.textContent = node.name;
    panelName.title = node.name;

    const stage = node.annotations.whatif ? node.annotations.whatif.stage : null;
    let html = '<div class="panel-section"><div class="panel-idrow">'
      + '<span class="chip ' + (WI_STATE_CHIP[res.state] || '') + '">'
      + esc(res.when === 'on_failure' ? 'on failure only'
          : (WI_STATE_LABEL[res.state] || res.state)) + '</span>'
      + (stage ? '<span class="chip" data-tip="stage">' + esc(stage) + '</span>' : '')
      + '<span class="chip">' + esc(cand.label) + '</span>'
      + (fromBaseline
          ? '<span class="chip chip-info" data-tip="Outcome in the pinned baseline scenario, not the current one">baseline</span>'
          : '')
      + (wiDupSet.has(jobId)
          ? '<span class="chip chip-warn" data-tip="This job may run in more than one pipeline spawned by the same event">duplicate</span>'
          : '')
      + '</div>'
      + (node.source ? '<div class="value">' + locHtml(node.source) + '</div>' : '')
      + '</div>';

    html += '<div class="panel-section"><h3>Verdict</h3><div class="value wrap-any">'
      + esc(wiOutcomeSummary(res)) + '</div>';
    if (res.state === 'conditional') {
      html += '<div class="tl-note" style="margin-top:var(--sp-1)">if it holds → '
        + esc(wiOutcomeSummary(res.then)) + '<br>otherwise → '
        + esc(wiOutcomeSummary(res.otherwise)) + '</div>';
    }
    html += '</div>';

    if (res.matrix && res.matrix.length) {
      html += '<div class="panel-section"><h3>Matrix instances (' + res.matrix.length
        + ')</h3><ul class="edge-list">'
        + res.matrix.map(m =>
            '<li><span class="edge-target clip" title="' + esc(m.name) + '">'
            + esc(m.name) + '</span><span class="chip ' + (WI_STATE_CHIP[m.state] || '')
            + '">' + esc(WI_STATE_LABEL[m.state] || m.state) + '</span></li>').join('')
        + '</ul></div>';
    }

    html += '<div class="panel-section"><h3>Rule-by-rule trace</h3>'
      + (res.matrix && res.matrix.length
          ? '<div class="tl-note" style="margin-bottom:var(--sp-1)">trace shown for the representative instance</div>'
          : '')
      + wiTraceHtml(res) + '</div>';

    const related = [];
    cand.artifacts.errors.forEach(e => {
      if (e.job === jobId || e.target === jobId) related.push(wiDiag('error', esc(e.message)));
    });
    cand.artifacts.notes.forEach(n => {
      if (n.job === jobId || n.producer === jobId) {
        related.push(wiDiag(n.kind === 'dotenv' ? 'info' : 'warning', esc(n.message)));
      }
    });
    if (related.length) {
      html += '<div class="panel-section"><h3>Artifacts &amp; environment</h3>'
        + related.join('') + '</div>';
    }

    html += '<div class="panel-section"><button class="btn" id="wi-full-detail">'
      + 'Full job details</button></div>';

    panelBody.innerHTML = html;
    panelBody.scrollTop = 0;
    wirePanel();
    const btn = document.getElementById('wi-full-detail');
    if (btn) btn.addEventListener('click', () => showNodeDetail(jobId));
  }

  const wiCopyBtn = document.getElementById('wi-copy-text');
  const wiMdBtn = document.getElementById('wi-copy-md');
  const wiExportBtn = document.getElementById('wi-export-scenario');
  const wiPinBtn = document.getElementById('wi-pin-baseline');

  // Clipboard fallback for browsers where the async API is unavailable or
  // denied on file:// — and if even that fails, select the visible text so
  // a manual Ctrl+C finishes the job.
  function wiCopyFallback(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (err) { /* stays false */ }
    document.body.removeChild(ta);
    return ok;
  }

  function wiSelectText() {
    const det = document.getElementById('wi-text-details');
    if (det) { det.open = true; wiTextOpen = true; }
    const pre = document.getElementById('wi-text-pre');
    if (!pre) return;
    const range = document.createRange();
    range.selectNodeContents(pre);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  function wiUpdatePinBtn() {
    wiPinBtn.textContent = wiBaseline ? 'Unpin baseline' : 'Pin as baseline';
    wiPinBtn.classList.toggle('wi-pinned', !!wiBaseline);
  }

  function wiCopyLabel() {
    return wiBaseline ? 'Copy delta' : 'Copy job list';
  }

  function wiMdLabel() {
    return wiBaseline ? 'Copy markdown delta' : 'Copy markdown';
  }

  // Shared copy flow for the toolbar buttons: async clipboard, hidden-
  // textarea fallback; if both fail the payload lands selected in the text
  // block so a manual Ctrl+C always works.
  function wiClipboardFlow(btn, text, restoreLabel) {
    const done = ok => {
      btn.textContent = ok ? 'Copied ✓' : 'Select + Ctrl+C';
      if (!ok) {
        const pre = document.getElementById('wi-text-pre');
        if (pre) pre.textContent = text;
        wiSelectText();
      }
      setTimeout(() => { btn.textContent = restoreLabel(); }, 1800);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text)
        .then(() => done(true), () => done(wiCopyFallback(text)));
    } else {
      done(wiCopyFallback(text));
    }
  }

  if (whatifAvailable) {
    wiShowSkippedEl.addEventListener('change', renderWiResults);
    wiCopyBtn.addEventListener('click', () => {
      wiClipboardFlow(wiCopyBtn, wiCopyText, wiCopyLabel);
    });
    wiMdBtn.addEventListener('click', () => {
      wiClipboardFlow(wiMdBtn, wiCopyMd, wiMdLabel);
    });
    wiExportBtn.addEventListener('click', () => {
      wiClipboardFlow(wiExportBtn, WIENGINE.scenarioYaml(wiConfig()),
                      () => 'Export scenario');
    });
    wiPinBtn.addEventListener('click', () => {
      if (wiBaseline) {
        wiBaseline = null;
      } else {
        const cfg = wiConfig();
        try {
          wiBaseline = {
            config: cfg,
            result: WIENGINE.evaluateEvent(REPORT, cfg),
            label: WIENGINE.describeConfig(cfg)
          };
        } catch (err) {
          wiBaseline = null;
        }
      }
      wiUpdatePinBtn();
      renderWiResults();
    });
    renderWiControls();
    renderWiResults();
  }

  /* ==========================================================
     Search: keyboard-first, grouped results
     ========================================================== */
  const searchInput = document.getElementById('global-search');
  const searchResults = document.getElementById('search-results');
  let searchItems = [];   // flat list in DOM order
  let searchActive = -1;

  function buildResults(q) {
    const groups = [
      { title: 'Tasks & targets', items: [] },
      { title: 'Variables', items: [] },
      { title: 'Files', items: [] }
    ];
    REPORT.nodes.forEach(n => {
      if (n.name.toLowerCase().includes(q)) {
        groups[0].items.push({
          label: n.name,
          chip: KIND_LABELS[n.kind] || n.kind,
          action: () => { switchToView('graph'); graph.revealNode(n.id); showNodeDetail(n.id, { keepGraphSelection: true }); }
        });
      }
    });
    REPORT.variables.forEach(v => {
      if (v.name.toLowerCase().includes(q)) {
        groups[1].items.push({
          label: '$(' + v.name + ')',
          match: v.name,
          chip: 'variable',
          action: () => { switchToView('variables'); showVarDetail(v.name); }
        });
      }
    });
    REPORT.files.forEach(f => {
      if (f.path.toLowerCase().includes(q)) {
        groups[2].items.push({
          label: f.path,
          chip: 'file',
          action: () => revealFile(f.path)
        });
      }
    });
    return groups;
  }

  function renderSearch() {
    const q = searchInput.value.toLowerCase().trim();
    searchItems = [];
    searchActive = -1;
    if (!q) { closeSearch(); return; }
    const groups = buildResults(q);
    const total = groups.reduce((n, g) => n + g.items.length, 0);
    let html = '';
    if (!total) {
      html = '<div class="sr-empty">No matches for “' + esc(searchInput.value.trim()) + '”.<br>'
        + 'Search covers task names, variables, and file paths.</div>';
    } else {
      let idx = 0;
      groups.forEach(g => {
        if (!g.items.length) return;
        html += '<div class="sr-group-title">' + g.title + ' (' + g.items.length + ')</div>';
        g.items.slice(0, 12).forEach(item => {
          html += '<div class="search-result" role="option" data-idx="' + idx + '" id="sr-' + idx + '">'
            + '<span class="sr-label clip" title="' + esc(item.label) + '">'
            + highlightMatch(item.label, item.match ? q : q) + '</span>'
            + '<span class="chip">' + esc(item.chip) + '</span></div>';
          searchItems.push(item);
          idx++;
        });
        if (g.items.length > 12) {
          html += '<div class="sr-empty" style="padding:var(--sp-1) var(--sp-3);text-align:left">'
            + '+ ' + (g.items.length - 12) + ' more — keep typing to narrow down</div>';
        }
      });
    }
    searchResults.innerHTML = html;
    searchResults.classList.add('open');
    searchInput.setAttribute('aria-expanded', 'true');
    searchResults.querySelectorAll('.search-result').forEach(el => {
      el.addEventListener('click', () => pickResult(parseInt(el.dataset.idx, 10)));
    });
  }

  function pickResult(i) {
    const item = searchItems[i];
    if (!item) return;
    closeSearch();
    searchInput.value = '';
    item.action();
  }
  function closeSearch() {
    searchResults.classList.remove('open');
    searchInput.setAttribute('aria-expanded', 'false');
    searchActive = -1;
  }
  function moveActive(delta) {
    if (!searchItems.length) return;
    searchActive = (searchActive + delta + searchItems.length) % searchItems.length;
    searchResults.querySelectorAll('.search-result').forEach((el, i) => {
      el.classList.toggle('active', i === searchActive);
    });
    const el = document.getElementById('sr-' + searchActive);
    if (el) el.scrollIntoView({ block: 'nearest' });
  }

  searchInput.addEventListener('input', renderSearch);
  searchInput.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); if (!searchResults.classList.contains('open')) renderSearch(); moveActive(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); moveActive(-1); }
    else if (e.key === 'Enter') {
      e.preventDefault();
      if (searchActive >= 0) pickResult(searchActive);
      else if (searchItems.length) pickResult(0);
    } else if (e.key === 'Escape') {
      if (searchResults.classList.contains('open')) closeSearch();
      else { searchInput.value = ''; searchInput.blur(); }
    }
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('.search-wrap')) closeSearch();
  });
  document.addEventListener('keydown', e => {
    const inField = /^(input|textarea|select)$/i.test(document.activeElement && document.activeElement.tagName || '');
    if ((e.key === '/' && !inField) || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k')) {
      e.preventDefault();
      searchInput.focus();
      searchInput.select();
    }
  });

  /* ==========================================================
     Init
     ========================================================== */
  renderCatalog();
  renderVariables();
  renderFileMap();
  requestAnimationFrame(() => graph.layout());
})();
</script>
</body>
</html>
