name: CI
on:
  push:
    branches: [main, "releases/**"]
    paths:
      - "src/**"
      - "!src/docs/**"
  pull_request:

env:
  APP_NAME: widget
  CACHE_VERSION: "3"

jobs:
  ## Build the application
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_TARGET: dist
    steps:
      - uses: actions/checkout@v4
      - name: Compile
        run: |
          make build
          echo "built $APP_NAME"

  ## Run the test suite
  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - run: make test

  ## Deploy to production (only on main)
  deploy:
    runs-on: [self-hosted, linux]
    needs: [build, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        run: ./deploy.sh production
