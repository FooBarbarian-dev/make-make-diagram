name: Deploy
on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
        description: Target environment name

jobs:
  ## Push the build to the requested environment
  push_release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./deploy.sh ${{ inputs.environment }}

  verify:
    runs-on: ubuntu-latest
    needs: push_release
    steps:
      - run: ./smoke.sh
